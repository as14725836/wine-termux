name: Compile Wine TkG wow64 (auto)

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Wine release tag（可选，例如：wine-9.22，不填则使用最新tag）"
        required: false
        type: string
      tkg:
        description: "Wine TkG仓库分支"
        required: false
        type: string
      enable_mf:
        description: "启用 Proton MF 解码"
        required: false
        type: boolean
        default: false
      enable_esync:
        description: "启用 esync（新版 wine 的 esync-unix 补丁可能不兼容，失败时关闭此开关绕过）"
        required: false
        type: boolean
        default: true
      skip_39bit:
        description: "跳过 39-bit VA 适配（对照实验：判断崩溃是补丁引起还是上游引起）"
        required: false
        type: boolean
        default: false
      no_staging:
        description: "关闭 TkG staging（对照构建：对齐纯净 wine，用于定位 staging 补丁问题）"
        required: false
        type: boolean
        default: false
      pkg_suffix:
        description: "产物后缀（如 no39bit），体现在 Release tag / 源码分支名，避免覆盖现有包"
        required: false
        type: string
  schedule:
    - cron: "0 1 * * *"

jobs:
  BCC:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore last wine release tag from cache
        id: cache-tag
        uses: actions/cache@v4
        with:
          path: .wine_last_tag
          key: wine-last-tag

      - name: Get latest wine tag
        id: wine-mirror
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
          ENABLE_MF: ${{ github.event.inputs.enable_mf || 'false' }}
        run: |
          if [ -n "$CUSTOM_TAG" ]; then
            echo "Use custom tag from manual dispatch: $CUSTOM_TAG"
            latest_tag="$CUSTOM_TAG"
          else
            latest_tag=$(git ls-remote --tags https://github.com/wine-mirror/wine.git | \
              grep -Ev '\^\{\}$' | sed 's/.*\///' | grep -E '^wine-[0-9]+\.[0-9]+.*$' | sort -V | tail -n 1)
          fi
          if [ -z "$latest_tag" ]; then
            echo "❌ Failed to get latest Wine tag!"
            exit 1
          fi
          echo "Latest Wine tag: $latest_tag"
          echo "$latest_tag" > .wine_current_tag
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "enable_mf=$ENABLE_MF" >> "$GITHUB_OUTPUT"
      - name: Read last saved tag (if any)
        id: last
        run: |
          if [ -f .wine_last_tag ]; then
            last_tag=$(cat .wine_last_tag)
          else
            last_tag=""
          fi
          echo "Last Wine tag: $last_tag"
          echo "tag=$last_tag" >> "$GITHUB_OUTPUT"
      - name: Compare tags and decide whether to run build
        id: need_build
        run: |
          event_name="${{ github.event_name }}"
          if [ "$event_name" = "workflow_dispatch" ]; then
            echo "Manual dispatch, force build."
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            current_tag="${{ steps.wine-mirror.outputs.tag }}"
            last_tag="${{ steps.last.outputs.tag }}"
            if [ "$current_tag" != "$last_tag" ]; then
              echo "New release detected: $current_tag (was $last_tag)"
              echo "new_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "No change in Wine tag, skip build."
              echo "new_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Set build variables
        if: steps.need_build.outputs.new_release == 'true'
        id: wine_tag
        run: |
          wine_tag="${{ steps.wine-mirror.outputs.tag }}"
          wine_ver="${wine_tag#wine-}"
          pkg_name="dxgi"
          if [[ "${{ steps.wine-mirror.outputs.enable_mf }}" == "true" ]]; then
            pkg_name="mf"
          fi
          # ---- 变体标记：自动反映构建开关，避免不同配置生成同名包 ----
          variant=""
          if [[ "${{ github.event.inputs.no_staging }}" == "true" ]]; then
            variant="nostg"
          fi
          if [[ "${{ github.event.inputs.skip_39bit }}" == "true" ]]; then
            variant="${variant:+${variant}-}no39bit"
          fi
          if [[ "${{ github.event.inputs.no_staging }}" == "true" ]]; then
            staging_state="off"
          else
            staging_state="on"
          fi
          if [[ "${{ github.event.inputs.skip_39bit }}" == "true" ]]; then
            patch39_state="skipped"
          else
            patch39_state="applied"
          fi
          variant_desc="TkG Staging GE"
          if [ -n "$variant" ]; then
            variant_desc="TkG Staging GE [${variant} staging=${staging_state} 39bit=${patch39_state}]"
          fi
          pkg_suffix="${{ github.event.inputs.pkg_suffix }}"
          if [ -n "$pkg_suffix" ]; then
            pkg_name="${pkg_name}-${pkg_suffix}"
          elif [ -n "$variant" ]; then
            pkg_name="${pkg_name}-${variant}"
          fi
          echo "PKG_NAME=$pkg_name (variant=${variant:-default})"
          echo "wine_tag=$wine_tag" >> "$GITHUB_OUTPUT"
          echo "wine_ver=$wine_ver" >> "$GITHUB_OUTPUT"
          echo "PKG_NAME=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "VARIANT=${variant:-default}" >> "$GITHUB_OUTPUT"
          echo "VARIANT_DESC=$variant_desc" >> "$GITHUB_OUTPUT"
          echo "STAGING=${staging_state}" >> "$GITHUB_OUTPUT"
          echo "PATCH39=${patch39_state}" >> "$GITHUB_OUTPUT"
          echo "enable_esync=${{ github.event.inputs.enable_esync || 'true' }}" >> "$GITHUB_OUTPUT"
      - name: Clone project & setup rootfs
        if: steps.need_build.outputs.new_release == 'true'
        env:
          NO_STAGING: ${{ github.event.inputs.no_staging || 'false' }}
        run: |
          echo "Using Wine tag: ${{ steps.wine_tag.outputs.wine_tag }}"
          cat > ~/.gitconfig << EOF
          [fetch]
            parallel = $(nproc)
          [submodule]
            fetchJobs = $(nproc)
          EOF
          tkg_branch="${{ github.event.inputs.tkg }}"
          if [ -z "$tkg_branch" ]; then
            git clone https://github.com/Frogging-Family/wine-tkg-git.git
          else
            git clone -b "$tkg_branch" https://github.com/Frogging-Family/wine-tkg-git.git
          fi
          cd /tmp
          aria2c -s$(nproc) -x$(nproc) https://github.com/as14725836/BCC/releases/download/wine-bcc-latest/wine-bcc.tar.xz
          sudo tar xf wine-bcc.tar.xz || { echo "❌ Extract failed"; exit 1; }
          if [ ! -d "archlinux" ]; then
            echo "❌ Expected 'archlinux' directory not found after extract!"
            exit 1
          fi
          sudo mv "$GITHUB_WORKSPACE/wine-tkg-git" archlinux/tmp/
          sudo cp -r -p "$GITHUB_WORKSPACE/"* archlinux/tmp/
          echo "Creating /tmp/wine-termux directory with required scripts..."
          sudo mkdir -p /tmp/archlinux/tmp/wine-termux
          
          if [ -f "$GITHUB_WORKSPACE/patch.sh" ]; then
            sudo cp "$GITHUB_WORKSPACE/patch.sh" /tmp/archlinux/tmp/wine-termux/
            echo "✅ Copied patch.sh"
          else
            echo "❌ patch.sh not found in repository root!"
            exit 1
          fi
          
          if [ -f "$GITHUB_WORKSPACE/set-tkg-cfg.sh" ]; then
            sudo cp "$GITHUB_WORKSPACE/set-tkg-cfg.sh" /tmp/archlinux/tmp/wine-termux/
            echo "✅ Copied set-tkg-cfg.sh"
          else
            echo "❌ set-tkg-cfg.sh not found in repository root!"
            exit 1
          fi
          
          sudo chmod +x /tmp/archlinux/tmp/wine-termux/*.sh
          
          echo "Contents of /tmp/wine-termux:"
          sudo ls -la /tmp/archlinux/tmp/wine-termux/
          cat > build-wine.sh << 'EOF'
          #!/bin/bash
          set -e
          mkdir -p ~/.cache
          if [ ! -f /tmp/wine-termux/patch.sh ]; then
            echo "❌ /tmp/wine-termux/patch.sh not found!"
            exit 1
          fi
          if [ ! -f /tmp/wine-termux/set-tkg-cfg.sh ]; then
            echo "❌ /tmp/wine-termux/set-tkg-cfg.sh not found!"
            exit 1
          fi
          if [ -f /tmp/ccache.tar.xz ]; then
            echo "✅ Using cached ccache..."
            mkdir -p ~/.cache/ccache
            tar xvf /tmp/ccache.tar.xz -C ~/.cache/
          fi
          export USE_CACHE=1
          export ENABLE_PROTON_MF=${{ steps.wine-mirror.outputs.enable_mf }}
          export ENABLE_ESYNC=${{ steps.wine_tag.outputs.enable_esync }}
          cd /tmp/wine-tkg-git/wine-tkg-git/
          bash -x /tmp/wine-termux/patch.sh wine-tkg-auto "${{ steps.wine_tag.outputs.wine_tag }}" /tmp/wine-tkg-git/wine-tkg-git/wine-tkg-userpatches || exit 1
          bash -x /tmp/wine-termux/set-tkg-cfg.sh "${{ steps.wine_tag.outputs.wine_tag }}" /tmp/wine-tkg-git/wine-tkg-git || exit 1
          if [ "$ENABLE_ESYNC" = "false" ]; then
            echo "⚠️ esync 已手动禁用，将关闭 _use_esync"
            sed -i 's/^_use_esync=.*/_use_esync="false"/' customization.cfg
            grep -q '^_use_esync=' customization.cfg || echo '_use_esync="false"' >> customization.cfg
          fi
          echo '_ci_build="true"' >> customization.cfg

          # ===================== Termux 路径修复 hook 开始 =====================
          TKG_DIR="/tmp/wine-tkg-git/wine-tkg-git"
          PREPARE_SH="${TKG_DIR}/wine-tkg-scripts/prepare.sh"
          NMBS="${TKG_DIR}/non-makepkg-build.sh"

          if [ ! -f "$PREPARE_SH" ]; then
            echo "❌ prepare.sh not found: $PREPARE_SH"
            exit 1
          fi
          if [ ! -f "$NMBS" ]; then
            echo "❌ non-makepkg-build.sh not found: $NMBS"
            exit 1
          fi

          # 1) 把 _termux_path_fix 函数追加到 prepare.sh 末尾
          _hook_src=""
          for _c in "$GITHUB_WORKSPACE/ci/tkg_prepare_hook.sh" /tmp/ci/tkg_prepare_hook.sh /tmp/wine-termux/tkg_prepare_hook.sh; do
            if [ -f "$_c" ]; then _hook_src="$_c"; break; fi
          done
          if [ -n "$_hook_src" ]; then
            echo "注入 prepare.sh 钩子: $_hook_src"
            cat "$_hook_src" >> "$PREPARE_SH"
          else
            echo "找不到 ci/tkg_prepare_hook.sh（已试 GITHUB_WORKSPACE/ci、/tmp/ci、/tmp/wine-termux）"
            exit 1
          fi

          # 2) 在 non-makepkg-build.sh 的 `_prepare` 后插入 `_termux_path_fix`
          awk '
            /^[[:space:]]*_prepare[[:space:]]*$/ && !done {
              print
              print "        _termux_path_fix"
              done=1
              next
            }
            { print }
          ' "$NMBS" > "$NMBS.new" && mv "$NMBS.new" "$NMBS"

          echo "===== Hook check ====="
          grep -n "_termux_path_fix" "$NMBS" || { echo "❌ Hook injection failed"; exit 1; }

          # ---- 39-bit 适配开关（workflow_dispatch 输入 skip_39bit）----
          if [ "${{ github.event.inputs.skip_39bit }}" = "true" ]; then
            sudo touch /tmp/archlinux/tmp/wine-termux/.skip39bit 2>/dev/null || true
            if [ -f /tmp/archlinux/tmp/wine-termux/.skip39bit ]; then
              echo "SKIP39BIT: 已创建标记 /tmp/wine-termux/.skip39bit -> 本次构建不带 39-bit 适配"
            else
              echo "SKIP39BIT: 警告：标记创建失败，将照常应用 39-bit 适配"
            fi
          fi
          grep -n "_termux_path_fix" "$PREPARE_SH" || { echo "❌ Hook function missing"; exit 1; }
          # ===================== Termux 路径修复 hook 结束 =====================

          chmod +x ./non-makepkg-build.sh
          # ---- TkG 的 userpatch 失败是硬 abort（如 LAA-unix-staging-wow64-<commit>.patch 只适配特定 staging 基线）。
          #      改成：打不上的补丁自动剔除后重试，最多 9 次。_prepare 只是 clone+打补丁，重试很快。
          _tkg_ok=0
          for _try in 1 2 3 4 5 6 7 8 9; do
            if yes | ./non-makepkg-build.sh > /tmp/tkg_build.out 2>&1; then
              _tkg_ok=1
              echo "✅ TkG build succeeded (attempt $_try)"
              tail -5 /tmp/tkg_build.out || true
              break
            fi
            echo "⚠️ TkG build failed (attempt $_try), 最后 20 行："
            tail -20 /tmp/tkg_build.out || true
            # ---- 只对「补丁打不上」做剔除 ----
            # 编译错误绝不能删补丁：上一轮就是这么把核心 wine-tkg-staging 补丁删掉的
            if ! grep -q 'Patch application has failed' /tmp/tkg_build.out; then
              echo "❌ 本次不是补丁问题（编译或其他错误），不做任何补丁剔除"
              grep -aE 'error:|Error 1|undefined|undeclared' /tmp/tkg_build.out | sed -n '1,15p' || true
              exit 1
            fi
            _patline=$(grep -an 'Patch application has failed' /tmp/tkg_build.out | sed -n '1p' | cut -d: -f1)
            _bad=$(sed -n "1,$((_patline-1))p" /tmp/tkg_build.out | grep -oE 'Applying [^ ]+\.patch' | tail -1 | sed 's/^Applying //')
            if [ -z "${_bad}" ]; then
              _bad=$(grep -aoE '[A-Za-z0-9_.+-]+\.patch' /tmp/tkg_build.out | tail -1)
            fi
            _fam="${_bad%-*.patch}"          # 去掉 -<commit>.patch，得到家族名
            echo "⚠️ 补丁打不上: ${_bad} (家族: ${_fam})"
            # ---- 白名单：只剔除已知对版本基线敏感的补丁，核心补丁一律不删 ----
            case "${_fam}" in
              LAA-unix-staging-wow64) ;;
              *)
                echo "❌ 失败补丁家族 ${_fam} 不在白名单，拒绝删除（避免破坏构建）"
                exit 1 ;;
            esac
            _hit=0
            # chroot 里没有 /dev/fd，不能用 < <(...) 进程替换；改成写临时文件再读
            _list=/tmp/_patch_hits.txt
            : > "${_list}"
            for _pat in "${_bad}" "${_fam}"; do
              [ -n "${_pat}" ] || continue
              for _root in /tmp /root /home /var/tmp /opt /usr/src /build /srv; do
                [ -d "${_root}" ] || continue
                find "${_root}" -name "${_pat}*" -type f 2>/dev/null | sed -n '1,10p' >> "${_list}"
              done
            done
            sort -u "${_list}" -o "${_list}" 2>/dev/null || true
            echo "--- 命中候选 ---"
            cat "${_list}"
            while IFS= read -r _x; do
              [ -n "${_x}" ] || continue
              echo "   rm ${_x}"
              rm -f "${_x}" && _hit=1
            done < "${_list}"
            if [ "${_hit}" = "0" ]; then
              echo "❌ 找不到补丁文件；打印诊断："
              echo "--- *userpatch* 目录下的 .patch ---"
              find /tmp /root /opt -name '*.patch' -path '*userpatch*' 2>/dev/null | sed -n '1,40p'
              echo "--- TkG userpatches 目录 ---"
              ls -la /tmp/wine-tkg-git/wine-tkg-git/wine-tkg-userpatches 2>/dev/null | sed -n '1,30p'
              echo "--- TkG 顶层 ---"
              ls -la /tmp/wine-tkg-git/wine-tkg-git 2>/dev/null | sed -n '1,30p'
              echo "--- 挂载情况 ---"
              mount 2>/dev/null | sed -n '1,20p'
              echo "--- 日志里出现过的 *.patch ---"
              grep -aoE '[A-Za-z0-9_.+-]+\\.patch' /tmp/tkg_build.out | sort -u | sed -n '1,30p'
              exit 1
            fi
            echo "⚠️ 已移除打不上的补丁，重试"
          done
          [ "${_tkg_ok}" = "1" ] || { echo "❌ 重试多次仍失败"; exit 1; }
          cd /tmp/output/
          tar -I 'xz -T$(nproc) -9' -cvf "/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz" */
          cd ~/.cache/
          rm -rf /tmp/ccache.tar.xz
          tar -I 'xz -T$(nproc)' -cvf /tmp/ccache.tar.xz ccache
          echo "✅ Build completed and ccache archived."
          EOF
          sudo chmod +x build-wine.sh
          sudo mkdir -p archlinux/bin
          if [ -d archlinux/bin/build-wine.sh ]; then
            echo "⚠️ archlinux/bin/build-wine.sh 是目录（历史遗留）→ 先移除再放文件"
            sudo rm -rf archlinux/bin/build-wine.sh
          fi
          sudo mv -f build-wine.sh archlinux/bin/build-wine.sh
      - name: Restore ccache
        if: steps.need_build.outputs.new_release == 'true'
        uses: actions/cache/restore@v5
        with:
          path: /tmp/archlinux/tmp/ccache.tar.xz
          key: wine-tkg-ccache-Linux-x86_64
          restore-keys: |
            wine-tkg-ccache-Linux-x86_64
      - name: Compile Using BCC Chroot
        if: steps.need_build.outputs.new_release == 'true'
        run: |
          cd /tmp
          bash "$GITHUB_WORKSPACE/mount.sh" archlinux mount
          sudo chroot archlinux /bin/build-wine.sh
          bash "$GITHUB_WORKSPACE/mount.sh" archlinux unmount
          if [ ! -f "/tmp/archlinux/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz" ]; then
            echo "❌ Build output not found!"
            exit 1
          fi
          sudo chmod 644 "/tmp/archlinux/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz"
          sudo chmod 644 /tmp/archlinux/tmp/ccache.tar.xz
      - name: Save ccache
        if: steps.need_build.outputs.new_release == 'true' && github.run_attempt == 1
        uses: actions/cache/save@v5
        with:
          path: /tmp/archlinux/tmp/ccache.tar.xz
          key: wine-tkg-ccache-Linux-x86_64

      - name: Upload Source to wine-termux
        if: steps.need_build.outputs.new_release == 'true'
        run: |
          src_dir="/tmp/archlinux/tmp/wine-tkg/src/wine-git"
          if [ ! -d "$src_dir" ]; then
            echo "❌ Source directory not found: $src_dir"
            exit 1
          fi
          sudo chown -R $USER:$USER /tmp/archlinux/tmp/wine-tkg/src/wine-git
          cd /tmp/archlinux/tmp/wine-tkg/src/wine-git/
          sudo cp -r -p /tmp/archlinux/tmp/output/*/share/wine/wine-tkg-config.txt .
          sudo chmod 644 wine-tkg-config.txt
          sudo rm -rf .git
          cd "$src_dir"
          # ---- 写自描述构建信息（源码分支根目录，便于区分不同配置的包）----
          {
            echo "wine tag       : ${{ steps.wine_tag.outputs.wine_tag }}"
            echo "package name   : ${{ steps.wine_tag.outputs.PKG_NAME }}"
            echo "variant        : ${{ steps.wine_tag.outputs.VARIANT }}"
            echo "staging        : ${{ steps.wine_tag.outputs.STAGING }}"
            echo "39-bit patch   : ${{ steps.wine_tag.outputs.PATCH39 }}"
            echo "enable_mf      : ${{ steps.wine-mirror.outputs.enable_mf || 'false' }}"
            echo "enable_esync   : ${{ steps.wine_tag.outputs.enable_esync }}"
            echo "workflow sha   : ${{ github.sha }}"
            echo "run            : #${{ github.run_number }} (id ${{ github.run_id }})"
            echo "built at (UTC) : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "-- 源码树校验 --"
            echo "virtual.c 0x7fffff0000           : $(grep -c 0x7fffff0000 dlls/ntdll/unix/virtual.c || true)"
            echo "virtual.c 0x7ffe000000           : $(grep -c 0x7ffe000000 dlls/ntdll/unix/virtual.c || true)"
            echo "virtual.c wine_emulator_detected : $(grep -c wine_emulator_detected dlls/ntdll/unix/virtual.c || true)"
            echo "virtual.c box64/emu compat       : $(grep -c 'box64/emu compat' dlls/ntdll/unix/virtual.c || true)"
            echo "seccomp NATIVE_SYSCALL_ADDRESS_START : $(grep -rh NATIVE_SYSCALL_ADDRESS_START dlls/ntdll/unix/ 2>/dev/null | head -1 | tr -s ' ')"
          } > BUILD-INFO.txt
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch_name="${{ steps.wine_tag.outputs.wine_ver }}${{ steps.wine_tag.outputs.PKG_NAME }}"
          git checkout -b "$branch_name"
          git add .
          git commit -m "Auto-commit source for ${{ steps.wine_tag.outputs.wine_tag }} (PKG: ${{ steps.wine_tag.outputs.PKG_NAME }})"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/as14725836/wine-termux.git
          git push -f --set-upstream origin "$branch_name"
      - name: Create GitHub Release
        if: steps.need_build.outputs.new_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_commitish: ${{ steps.wine_tag.outputs.wine_ver }}${{ steps.wine_tag.outputs.PKG_NAME }}
          tag_name: ${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}
          name: Wine ${{ steps.wine_tag.outputs.wine_ver }} (${{ steps.wine_tag.outputs.PKG_NAME }}) ${{ steps.wine_tag.outputs.VARIANT_DESC }}
          body: |
            自动编译版本。

            | 项目 | 值 |
            |---|---|
            | wine tag | `${{ steps.wine_tag.outputs.wine_tag }}` |
            | 包名 | `${{ steps.wine_tag.outputs.PKG_NAME }}` |
            | 变体 | `${{ steps.wine_tag.outputs.VARIANT }}` |
            | TkG staging | `${{ steps.wine_tag.outputs.STAGING }}` |
            | 39-bit VA 适配 | `${{ steps.wine_tag.outputs.PATCH39 }}` |
            | Proton MF | `${{ steps.wine-mirror.outputs.enable_mf || 'false' }}` |
            | workflow | `${{ github.sha }}` |
            | run | #${{ github.run_number }} |

            box64 兼容补丁 / 39-bit / seccomp 阈值的**源码树实测值**见源码分支根目录的 `BUILD-INFO.txt`。

            [源码分支](https://github.com/as14725836/wine-termux/tree/${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}) ·
            [本次构建日志](https://github.com/as14725836/wine-termux/actions/runs/${{ github.run_id }})
          files: /tmp/archlinux/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz
          draft: false
          prerelease: false

      - name: Save current tag to cache file
        if: steps.need_build.outputs.new_release == 'true'
        run: |
          cp .wine_current_tag .wine_last_tag
      - name: Update tag cache
        if: steps.need_build.outputs.new_release == 'true'
        uses: actions/cache@v4
        with:
          path: .wine_last_tag
