name: Compile Wine TkG wow64 (auto)

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Wine release tag（可选，例如：wine-9.22，不填则使用最新tag）"
        required: false
        type: string
      tkg:
        description: "Wine TkG仓库分支"
        required: false
        type: string
      enable_mf:
        description: "启用 Proton MF 解码"
        required: false
        type: boolean
        default: false
      enable_esync:
        description: "启用 esync（新版 wine 的 esync-unix 补丁可能不兼容，失败时关闭此开关绕过）"
        required: false
        type: boolean
        default: true
      skip_39bit:
        description: "跳过 39-bit VA 适配（对照实验：判断崩溃是补丁引起还是上游引起）"
        required: false
        type: boolean
        default: false
      no_staging:
        description: "关闭 TkG staging（对照构建：对齐纯净 wine，用于定位 staging 补丁问题）"
        required: false
        type: boolean
        default: false
      pkg_suffix:
        description: "产物后缀（如 no39bit），体现在 Release tag / 源码分支名，避免覆盖现有包"
        required: false
        type: string
  schedule:
    - cron: "0 1 * * *"

jobs:
  BCC:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore last wine release tag from cache
        id: cache-tag
        uses: actions/cache@v4
        with:
          path: .wine_last_tag
          key: wine-last-tag

      - name: Get latest wine tag
        id: wine-mirror
        env:
          CUSTOM_TAG: ${{ github.event.inputs.tag }}
          ENABLE_MF: ${{ github.event.inputs.enable_mf || 'false' }}
        run: |
          if [ -n "$CUSTOM_TAG" ]; then
            echo "Use custom tag from manual dispatch: $CUSTOM_TAG"
            latest_tag="$CUSTOM_TAG"
          else
            latest_tag=$(git ls-remote --tags https://github.com/wine-mirror/wine.git | \
              grep -Ev '\^\{\}$' | sed 's/.*\///' | grep -E '^wine-[0-9]+\.[0-9]+.*$' | sort -V | tail -n 1)
          fi
          if [ -z "$latest_tag" ]; then
            echo "❌ Failed to get latest Wine tag!"
            exit 1
          fi
          echo "Latest Wine tag: $latest_tag"
          echo "$latest_tag" > .wine_current_tag
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "enable_mf=$ENABLE_MF" >> "$GITHUB_OUTPUT"
      - name: Read last saved tag (if any)
        id: last
        run: |
          if [ -f .wine_last_tag ]; then
            last_tag=$(cat .wine_last_tag)
          else
            last_tag=""
          fi
          echo "Last Wine tag: $last_tag"
          echo "tag=$last_tag" >> "$GITHUB_OUTPUT"
      - name: Compare tags and decide whether to run build
        id: need_build
        run: |
          event_name="${{ github.event_name }}"
          if [ "$event_name" = "workflow_dispatch" ]; then
            echo "Manual dispatch, force build."
            echo "new_release=true" >> "$GITHUB_OUTPUT"
          else
            current_tag="${{ steps.wine-mirror.outputs.tag }}"
            last_tag="${{ steps.last.outputs.tag }}"
            if [ "$current_tag" != "$last_tag" ]; then
              echo "New release detected: $current_tag (was $last_tag)"
              echo "new_release=true" >> "$GITHUB_OUTPUT"
            else
              echo "No change in Wine tag, skip build."
              echo "new_release=false" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Set build variables
        if: steps.need_build.outputs.new_release == 'true'
        id: wine_tag
        run: |
          wine_tag="${{ steps.wine-mirror.outputs.tag }}"
          wine_ver="${wine_tag#wine-}"
          pkg_name="dxgi"
          if [[ "${{ steps.wine-mirror.outputs.enable_mf }}" == "true" ]]; then
            pkg_name="mf"
          fi
          pkg_suffix="${{ github.event.inputs.pkg_suffix }}"
          if [ -n "$pkg_suffix" ]; then
            pkg_name="${pkg_name}-${pkg_suffix}"
            echo "pkg_suffix=$pkg_suffix -> PKG_NAME=$pkg_name"
          fi
          echo "wine_tag=$wine_tag" >> "$GITHUB_OUTPUT"
          echo "wine_ver=$wine_ver" >> "$GITHUB_OUTPUT"
          echo "PKG_NAME=$pkg_name" >> "$GITHUB_OUTPUT"
          echo "enable_esync=${{ github.event.inputs.enable_esync || 'true' }}" >> "$GITHUB_OUTPUT"
      - name: Clone project & setup rootfs
        if: steps.need_build.outputs.new_release == 'true'
        env:
          NO_STAGING: ${{ github.event.inputs.no_staging || 'false' }}
        run: |
          echo "Using Wine tag: ${{ steps.wine_tag.outputs.wine_tag }}"
          cat > ~/.gitconfig << EOF
          [fetch]
            parallel = $(nproc)
          [submodule]
            fetchJobs = $(nproc)
          EOF
          tkg_branch="${{ github.event.inputs.tkg }}"
          if [ -z "$tkg_branch" ]; then
            git clone https://github.com/Frogging-Family/wine-tkg-git.git
          else
            git clone -b "$tkg_branch" https://github.com/Frogging-Family/wine-tkg-git.git
          fi
          cd /tmp
          aria2c -s$(nproc) -x$(nproc) https://github.com/as14725836/BCC/releases/download/wine-bcc-latest/wine-bcc.tar.xz
          sudo tar xf wine-bcc.tar.xz || { echo "❌ Extract failed"; exit 1; }
          if [ ! -d "archlinux" ]; then
            echo "❌ Expected 'archlinux' directory not found after extract!"
            exit 1
          fi
          sudo mv "$GITHUB_WORKSPACE/wine-tkg-git" archlinux/tmp/
          sudo cp -r -p "$GITHUB_WORKSPACE/"* archlinux/tmp/
          echo "Creating /tmp/wine-termux directory with required scripts..."
          sudo mkdir -p /tmp/archlinux/tmp/wine-termux
          
          if [ -f "$GITHUB_WORKSPACE/patch.sh" ]; then
            sudo cp "$GITHUB_WORKSPACE/patch.sh" /tmp/archlinux/tmp/wine-termux/
            echo "✅ Copied patch.sh"
          else
            echo "❌ patch.sh not found in repository root!"
            exit 1
          fi
          
          if [ -f "$GITHUB_WORKSPACE/set-tkg-cfg.sh" ]; then
            sudo cp "$GITHUB_WORKSPACE/set-tkg-cfg.sh" /tmp/archlinux/tmp/wine-termux/
            echo "✅ Copied set-tkg-cfg.sh"
          else
            echo "❌ set-tkg-cfg.sh not found in repository root!"
            exit 1
          fi
          
          sudo chmod +x /tmp/archlinux/tmp/wine-termux/*.sh
          
          echo "Contents of /tmp/wine-termux:"
          sudo ls -la /tmp/archlinux/tmp/wine-termux/
          cat > build-wine.sh << 'EOF'
          #!/bin/bash
          set -e
          mkdir -p ~/.cache
          if [ ! -f /tmp/wine-termux/patch.sh ]; then
            echo "❌ /tmp/wine-termux/patch.sh not found!"
            exit 1
          fi
          if [ ! -f /tmp/wine-termux/set-tkg-cfg.sh ]; then
            echo "❌ /tmp/wine-termux/set-tkg-cfg.sh not found!"
            exit 1
          fi
          if [ -f /tmp/ccache.tar.xz ]; then
            echo "✅ Using cached ccache..."
            mkdir -p ~/.cache/ccache
            tar xvf /tmp/ccache.tar.xz -C ~/.cache/
          fi
          export USE_CACHE=1
          export ENABLE_PROTON_MF=${{ steps.wine-mirror.outputs.enable_mf }}
          export ENABLE_ESYNC=${{ steps.wine_tag.outputs.enable_esync }}
          cd /tmp/wine-tkg-git/wine-tkg-git/
          bash -x /tmp/wine-termux/patch.sh wine-tkg-auto "${{ steps.wine_tag.outputs.wine_tag }}" /tmp/wine-tkg-git/wine-tkg-git/wine-tkg-userpatches || exit 1
          bash -x /tmp/wine-termux/set-tkg-cfg.sh "${{ steps.wine_tag.outputs.wine_tag }}" /tmp/wine-tkg-git/wine-tkg-git || exit 1
          if [ "$ENABLE_ESYNC" = "false" ]; then
            echo "⚠️ esync 已手动禁用，将关闭 _use_esync"
            sed -i 's/^_use_esync=.*/_use_esync="false"/' customization.cfg
            grep -q '^_use_esync=' customization.cfg || echo '_use_esync="false"' >> customization.cfg
          fi
          echo '_ci_build="true"' >> customization.cfg

          # ===================== Termux 路径修复 hook 开始 =====================
          TKG_DIR="/tmp/wine-tkg-git/wine-tkg-git"
          PREPARE_SH="${TKG_DIR}/wine-tkg-scripts/prepare.sh"
          NMBS="${TKG_DIR}/non-makepkg-build.sh"

          if [ ! -f "$PREPARE_SH" ]; then
            echo "❌ prepare.sh not found: $PREPARE_SH"
            exit 1
          fi
          if [ ! -f "$NMBS" ]; then
            echo "❌ non-makepkg-build.sh not found: $NMBS"
            exit 1
          fi

          # 1) 把 _termux_path_fix 函数追加到 prepare.sh 末尾
          cat >> "$PREPARE_SH" << 'HOOKEOF'

          ########################################################################
          # Termux path fix + mfplat patch (auto-injected by CI)
          ########################################################################
          _termux_path_fix() {
            local _src="${srcdir}/${_winesrcdir}"
            if [ ! -d "$_src" ]; then
              warning "Termux path fix: source dir not found: $_src"
              return 0
            fi
            msg2 "Applying Termux path fix in $_src"
            pushd "$_src" &>/dev/null

            find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.in" -o -name "*.spec" \) \
              -exec grep -l "/tmp" {} \; | xargs -r sed -i 's|/tmp/|/data/data/com.termux/files/usr/tmp/|g'

            find server -type f \( -name "*.c" -o -name "*.h" \) \
              -exec sed -i 's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} + 2>/dev/null || true

            find . -name "file.c" \
              -exec sed -i 's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} + 2>/dev/null || true
            find . -name "loader.c" \
              -exec sed -i 's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} + 2>/dev/null || true
            find . -name "server.c" \
              -exec sed -i 's|"/tmp"|"/data/data/com.termux/files/usr/tmp"|g' {} + 2>/dev/null || true

            # ---- mfplat DXGI device manager patch ----
            local _mfplat_patch_url="https://raw.githubusercontent.com/as14725836/wine-termux/main/wine_do_not_create_dxgi_device_manager2.patch"
            local _mfplat_patch_file="/tmp/wine-termux/wine_do_not_create_dxgi_device_manager2.patch"

            if [ -f "$_mfplat_patch_file" ]; then
              msg2 "Using existing mfplat patch: $_mfplat_patch_file"
            else
              msg2 "Downloading mfplat patch..."
              if wget -O "$_mfplat_patch_file" "$_mfplat_patch_url"; then
                msg2 "mfplat patch downloaded"
              else
                warning "mfplat patch download failed, skipping"
                _mfplat_patch_file=""
              fi
            fi

            if [ -n "$_mfplat_patch_file" ] && [ -f "$_mfplat_patch_file" ]; then
              if [ -f "dlls/mfplat/main.c" ]; then
                msg2 "Applying mfplat patch to dlls/mfplat/main.c"
                if patch -p1 --forward < "$_mfplat_patch_file"; then
                  msg2 "mfplat patch applied successfully"
                else
                  warning "mfplat patch failed or already applied, continuing"
                fi
              else
                warning "dlls/mfplat/main.c not found, skipping mfplat patch"
              fi
            fi
            # ---- mfplat patch end ----
            # ---- adapted-11.18 user patches ----
            for _up in 0060-quartz-implement-colour-filter.patch \
                       0061-qasf-deliver-compressed-asf-streams.patch \
                       termux-dns-fix.patch \
                       wine-virtual-memory.patch \
                       wine-virtual-memory-39bit-hiarea.patch \
                       wine-box64-compat.patch; do
              case "$_up" in
                wine-virtual-memory*)
                  if [ -f /tmp/wine-termux/.skip39bit ]; then
                    warning "SKIP39BIT: 跳过 userpatch $_up"
                    continue
                  fi
                  ;;
              esac
              local _up_file="/tmp/wine-termux/$_up"
              local _up_url="https://raw.githubusercontent.com/as14725836/wine-termux/main/$_up"
              if [ ! -f "$_up_file" ]; then
                msg2 "Downloading userpatch $_up"
                if ! wget -O "$_up_file" "$_up_url"; then
                  warning "userpatch download failed: $_up"
                  continue
                fi
              fi
              msg2 "Applying userpatch $_up"
              if patch -p1 --forward --no-backup-if-mismatch < "$_up_file"; then
                msg2 "userpatch $_up applied OK"
              else
                warning "!!! userpatch $_up FAILED or already applied"
              fi
            done
            
            # ---- wine-virtual-memory.patch 校验 + 兜底（ARM64 39-bit VA 适配）----
            # 目标（补丁内容）：
            #   dlls/ntdll/unix/virtual.c : 三行 limit 0x7fffffff0000 -> 0x7fffff0000
            #   server/mapping.c          : free_map_addr(0x600000000000,0x100000000000) -> (0x4000000000,0x1000000000)
            #   loader/preloader.c        : `#ifdef __aarch64__` -> `#if 1`
            if [ -f /tmp/wine-termux/.skip39bit ]; then
              warning "SKIP39BIT: 跳过 wine-virtual-memory 适配（对照构建）"
            elif [ -f "dlls/ntdll/unix/virtual.c" ] && [ -f "server/mapping.c" ]; then
              VMC=$(grep -c '0x7fffff0000' dlls/ntdll/unix/virtual.c || true)
              if [ "${VMC}" = "0" ]; then
                warning "wine-virtual-memory 未生效 -> sed/perl 兜底"
                perl -pi -e 's/0x7fffffff0000/0x7fffff0000/ if /(address_space_limit|user_space_limit|working_set_limit)/' dlls/ntdll/unix/virtual.c
                sed -i 's/free_map_addr( 0x600000000000, 0x100000000000 )/free_map_addr( 0x4000000000, 0x1000000000 )/' server/mapping.c
                if [ -f loader/preloader.c ]; then
                  perl -0pi -e 's/(preload_info\[i\]\.addr >= \(void \*\)0x10000\n)#ifdef __aarch64__/$1#if 1/' loader/preloader.c
                fi
              fi
              VMC=$(grep -c '0x7fffff0000' dlls/ntdll/unix/virtual.c || true)
              MPC=$(grep -c 'free_map_addr( 0x4000000000, 0x1000000000 )' server/mapping.c || true)
              PLC=$(grep -c '#if 1' loader/preloader.c 2>/dev/null || echo 0)
              msg2 "wine-virtual-memory check: virtual.c=${VMC} mapping.c=${MPC} preloader=${PLC}"
              if [ "${VMC}" = "0" ]; then
                echo "!!! FAIL: wine-virtual-memory 未生效（virtual.c 无 0x7fffff0000）"
                exit 1
              fi
            else
              warning "wine-virtual-memory: 找不到目标文件，跳过"
            fi
            # ---- wine-virtual-memory 结束 ----
          # ---- 39-bit VA 完整化：Wine 的“高地址区”也必须落在 39-bit 以内 ----
          # wine-virtual-memory.patch 只把三个 limit 降到 0x7fffff0000（512GB），
          # 但 preloader 映射表与 virtual.c 的 no-preloader 兜底仍是 0x7ffffe000000（=128TB），
          # 在 39-bit VA 设备上 mmap 必然失败 -> "install_bpf ... low addresses" + "map_fixed_area out of memory 0x7fff..."
          if [ -f /tmp/wine-termux/.skip39bit ]; then
            warning "SKIP39BIT: 跳过高地址区适配（对照构建）"
          elif [ -f loader/preloader.c ] && [ -f dlls/ntdll/unix/virtual.c ]; then
            _hi_files=$(grep -rl '0x7ffffe000000' --include='*.c' --include='*.h' . 2>/dev/null || true)
            for _f in $_hi_files; do
              msg2 "39-bit VA: 高区下移 0x7ffffe000000 -> 0x7ffe000000 in ${_f}"
              sed -i 's/0x7ffffe000000/0x7ffe000000/g' "$_f"
            done
            _old_files=$(grep -rl '0x7fffffff0000' --include='*.c' --include='*.h' . 2>/dev/null || true)
            for _f in $_old_files; do
              msg2 "39-bit VA: 旧上限残留 -> 0x7fffff0000 in ${_f}"
              sed -i 's/0x7fffffff0000/0x7fffff0000/g' "$_f"
            done
            HIA=$(grep -c '0x7ffe000000' loader/preloader.c || true)
            VMA=$(grep -c '0x7ffe000000' dlls/ntdll/unix/virtual.c || true)
            LEFT=$( { grep -rn '0x7ffffe000000\|0x7fffffff0000' --include='*.c' --include='*.h' . 2>/dev/null || true; } | wc -l )
            msg2 "39-bit VA check: preloader=${HIA} virtual=${VMA} leftover=${LEFT}"
            if [ "${HIA}" = "0" ] || [ "${VMA}" = "0" ] || [ "${LEFT}" != "0" ]; then
              echo "!!! FAIL: 39-bit VA 高区适配未生效 (preloader=${HIA} virtual=${VMA} leftover=${LEFT})"
              exit 1
            fi
          else
            warning "39-bit VA: 找不到 preloader.c / virtual.c，跳过"
          fi

            # ---- wine-box64-compat.patch 校验（box64/模拟器下的地址空间收敛）----
            if [ -f dlls/ntdll/unix/virtual.c ]; then
              EMD=$(grep -c 'wine_emulator_detected' dlls/ntdll/unix/virtual.c || true)
              EMF=$(grep -c 'wine_emulator_addr_space_limit' dlls/ntdll/unix/virtual.c || true)
              EMC=$(grep -c 'box64/emu compat' dlls/ntdll/unix/virtual.c || true)
              msg2 "box64-compat check: detect=${EMD} limit_fn=${EMF} clamp=${EMC}"
              if [ "${EMD}" = "0" ] || [ "${EMF}" = "0" ] || [ "${EMC}" = "0" ]; then
                echo "!!! FAIL: wine-box64-compat 未生效 (detect=${EMD} limit_fn=${EMF} clamp=${EMC})"
                exit 1
              fi
            fi
            # ---- 39-bit VA：syscall-emulation（seccomp）阈值也在 39-bit 之外 ----
            # TkG/staging 的 install_bpf()（dlls/ntdll/unix/signal_*.c）用
            #   #define NATIVE_SYSCALL_ADDRESS_START 0x700000000000   (112 TB)
            #   test_syscall = mmap((void *)0x600000000000, ...)      (96 TB)
            # 来判断“原生库在高地址、PE 代码在低地址”。39-bit 设备上这两个值永远达不到，
            # 于是 seccomp 一辈子装不上，32 位 PE 代码的裸 syscall 就无人接管。
            # 这里把阈值降到 39-bit 空间内（64GB / 128GB），语义保持一致。
            if [ -f /tmp/wine-termux/.skip39bit ]; then
              warning "SKIP39BIT: 跳过 seccomp 阈值适配（对照构建）"
              _seccomp_files=""
            else
              _seccomp_files=$(grep -rl 'NATIVE_SYSCALL_ADDRESS_START' --include='*.c' . 2>/dev/null || true)
            fi
            for _f in $_seccomp_files; do
              msg2 "39-bit VA: seccomp 阈值下移 in ${_f}"
              perl -pi -e 's/(NATIVE_SYSCALL_ADDRESS_START\s+)0x[0-9a-fA-F]+/${1}0x1000000000/' "$_f"
              perl -pi -e 's/0x600000000000/0x2000000000/g if /test_syscall/' "$_f"
            done
            if [ -n "$_seccomp_files" ]; then
              _sc=$(cat $_seccomp_files 2>/dev/null | grep -cE 'NATIVE_SYSCALL_ADDRESS_START[[:space:]]+0x1000000000' || true)
              _old=$(cat $_seccomp_files 2>/dev/null | grep -cE 'NATIVE_SYSCALL_ADDRESS_START[[:space:]]+0x(700000000000|600000000000)' || true)
              msg2 "39-bit VA seccomp 明细:"; grep -nH 'NATIVE_SYSCALL_ADDRESS_START' $_seccomp_files 2>/dev/null | head -6 || true
              msg2 "39-bit VA seccomp check: new=${_sc} old=${_old}"
              if [ "${_sc}" = "0" ] || [ "${_old}" != "0" ]; then
                echo "!!! FAIL: seccomp 阈值未完成 39-bit 适配 (new=${_sc} old=${_old})"
                exit 1
              fi
            else
              warning "39-bit VA: 未找到 install_bpf 阈值（该树无 staging syscall-emulation），跳过"
            fi
            # ---- syscall-emulation 39-bit 结束 ----

            # --- .rej hard check ---
            if find . -name '*.rej' | head -5 | grep -q .; then
              warning "!!! .rej files detected:"
              find . -name '*.rej'
            fi
            
            # --- self check (visible in log) ---
            msg2 "self-check colour.c: $(ls dlls/quartz/colour.c 2>/dev/null || echo MISSING)"
            msg2 "self-check dns: $(grep -c init_dns_config dlls/ntdll/unix/loader.c 2>/dev/null || echo 0)"
            msg2 "self-check mfplat: $(grep -c resolver_create_default_handler dlls/mfplat/main.c 2>/dev/null || echo 0)"
            # ---- user patches end ----

            # ---- mfplat CLSID 兜底（wine-9.4 + TkG staging 混用）----
            # 现象（run #47 真实报错）：
            #   ../wine-git/dlls/mfplat/main.c:6299: error:
            #     'CLSID_MPEG4ByteStreamHandlerPlugin' undeclared
            # 原因：TkG staging 的 mfplat 改动用到了该 CLSID，但该版本的
            #       include/wine/mfinternal.idl 里没有这份 DEFINE_GUID 声明。
            # 处理：给 main.c 注入一个本地静态 GUID 并把引用改名（不依赖头文件，
            #       也不会和已有声明冲突）。
            if [ -f "dlls/mfplat/main.c" ] && grep -q '&CLSID_MPEG4ByteStreamHandlerPlugin' dlls/mfplat/main.c; then
              if grep -q '_wine_ci_mpeg4_bsh_clsid = {' dlls/mfplat/main.c; then
                msg2 "mfplat CLSID 兜底：已注入，跳过"
              else
                msg2 "mfplat CLSID 兜底：注入本地 GUID 定义"
                if grep -q '^#include "mfplat_private.h"$' dlls/mfplat/main.c; then
                  sed -i 's|^#include "mfplat_private.h"$|#include "mfplat_private.h"\n\nstatic const GUID _wine_ci_mpeg4_bsh_clsid = {0x271c3902, 0x6095, 0x4c45, {0xa2, 0x2f, 0x20, 0x09, 0x18, 0x16, 0xee, 0x9e}};|' dlls/mfplat/main.c
                elif grep -q '^#include "initguid.h"$' dlls/mfplat/main.c; then
                  sed -i 's|^#include "initguid.h"$|#include "initguid.h"\n\nstatic const GUID _wine_ci_mpeg4_bsh_clsid = {0x271c3902, 0x6095, 0x4c45, {0xa2, 0x2f, 0x20, 0x09, 0x18, 0x16, 0xee, 0x9e}};|' dlls/mfplat/main.c
                fi
                if grep -q '_wine_ci_mpeg4_bsh_clsid = {' dlls/mfplat/main.c; then
                  sed -i 's|&CLSID_MPEG4ByteStreamHandlerPlugin|\&_wine_ci_mpeg4_bsh_clsid|g' dlls/mfplat/main.c
                  msg2 "mfplat CLSID 兜底：引用已改名（$(grep -c '_wine_ci_mpeg4_bsh_clsid' dlls/mfplat/main.c) 处命中）"
                else
                  warning "mfplat CLSID 兜底：未能插入定义，跳过改名（避免引入未定义符号）"
                fi
              fi
            else
              msg2 "mfplat CLSID 兜底：无需处理"
            fi
            # ---- mfplat CLSID 兜底 end ----

            popd &>/dev/null
            msg2 "Termux path fix done"
          }
          ########################################################################
          HOOKEOF

          # 2) 在 non-makepkg-build.sh 的 `_prepare` 后插入 `_termux_path_fix`
          awk '
            /^[[:space:]]*_prepare[[:space:]]*$/ && !done {
              print
              print "        _termux_path_fix"
              done=1
              next
            }
            { print }
          ' "$NMBS" > "$NMBS.new" && mv "$NMBS.new" "$NMBS"

          echo "===== Hook check ====="
          grep -n "_termux_path_fix" "$NMBS" || { echo "❌ Hook injection failed"; exit 1; }

          # ---- 39-bit 适配开关（workflow_dispatch 输入 skip_39bit）----
          if [ "${{ github.event.inputs.skip_39bit }}" = "true" ]; then
            sudo touch /tmp/archlinux/tmp/wine-termux/.skip39bit 2>/dev/null || true
            if [ -f /tmp/archlinux/tmp/wine-termux/.skip39bit ]; then
              echo "SKIP39BIT: 已创建标记 /tmp/wine-termux/.skip39bit -> 本次构建不带 39-bit 适配"
            else
              echo "SKIP39BIT: 警告：标记创建失败，将照常应用 39-bit 适配"
            fi
          fi
          grep -n "_termux_path_fix" "$PREPARE_SH" || { echo "❌ Hook function missing"; exit 1; }
          # ===================== Termux 路径修复 hook 结束 =====================

          chmod +x ./non-makepkg-build.sh
          # ---- TkG 的 userpatch 失败是硬 abort（如 LAA-unix-staging-wow64-<commit>.patch 只适配特定 staging 基线）。
          #      改成：打不上的补丁自动剔除后重试，最多 9 次。_prepare 只是 clone+打补丁，重试很快。
          _tkg_ok=0
          for _try in 1 2 3 4 5 6 7 8 9; do
            if yes | ./non-makepkg-build.sh > /tmp/tkg_build.out 2>&1; then
              _tkg_ok=1
              echo "✅ TkG build succeeded (attempt $_try)"
              tail -5 /tmp/tkg_build.out || true
              break
            fi
            echo "⚠️ TkG build failed (attempt $_try), 最后 20 行："
            tail -20 /tmp/tkg_build.out || true
            # ---- 只对「补丁打不上」做剔除 ----
            # 编译错误绝不能删补丁：上一轮就是这么把核心 wine-tkg-staging 补丁删掉的
            if ! grep -q 'Patch application has failed' /tmp/tkg_build.out; then
              echo "❌ 本次不是补丁问题（编译或其他错误），不做任何补丁剔除"
              grep -aE 'error:|Error 1|undefined|undeclared' /tmp/tkg_build.out | sed -n '1,15p' || true
              exit 1
            fi
            _patline=$(grep -an 'Patch application has failed' /tmp/tkg_build.out | sed -n '1p' | cut -d: -f1)
            _bad=$(sed -n "1,$((_patline-1))p" /tmp/tkg_build.out | grep -oE 'Applying [^ ]+\.patch' | tail -1 | sed 's/^Applying //')
            if [ -z "${_bad}" ]; then
              _bad=$(grep -aoE '[A-Za-z0-9_.+-]+\.patch' /tmp/tkg_build.out | tail -1)
            fi
            _fam="${_bad%-*.patch}"          # 去掉 -<commit>.patch，得到家族名
            echo "⚠️ 补丁打不上: ${_bad} (家族: ${_fam})"
            # ---- 白名单：只剔除已知对版本基线敏感的补丁，核心补丁一律不删 ----
            case "${_fam}" in
              LAA-unix-staging-wow64) ;;
              *)
                echo "❌ 失败补丁家族 ${_fam} 不在白名单，拒绝删除（避免破坏构建）"
                exit 1 ;;
            esac
            _hit=0
            # chroot 里没有 /dev/fd，不能用 < <(...) 进程替换；改成写临时文件再读
            _list=/tmp/_patch_hits.txt
            : > "${_list}"
            for _pat in "${_bad}" "${_fam}"; do
              [ -n "${_pat}" ] || continue
              for _root in /tmp /root /home /var/tmp /opt /usr/src /build /srv; do
                [ -d "${_root}" ] || continue
                find "${_root}" -name "${_pat}*" -type f 2>/dev/null | sed -n '1,10p' >> "${_list}"
              done
            done
            sort -u "${_list}" -o "${_list}" 2>/dev/null || true
            echo "--- 命中候选 ---"
            cat "${_list}"
            while IFS= read -r _x; do
              [ -n "${_x}" ] || continue
              echo "   rm ${_x}"
              rm -f "${_x}" && _hit=1
            done < "${_list}"
            if [ "${_hit}" = "0" ]; then
              echo "❌ 找不到补丁文件；打印诊断："
              echo "--- *userpatch* 目录下的 .patch ---"
              find /tmp /root /opt -name '*.patch' -path '*userpatch*' 2>/dev/null | sed -n '1,40p'
              echo "--- TkG userpatches 目录 ---"
              ls -la /tmp/wine-tkg-git/wine-tkg-git/wine-tkg-userpatches 2>/dev/null | sed -n '1,30p'
              echo "--- TkG 顶层 ---"
              ls -la /tmp/wine-tkg-git/wine-tkg-git 2>/dev/null | sed -n '1,30p'
              echo "--- 挂载情况 ---"
              mount 2>/dev/null | sed -n '1,20p'
              echo "--- 日志里出现过的 *.patch ---"
              grep -aoE '[A-Za-z0-9_.+-]+\\.patch' /tmp/tkg_build.out | sort -u | sed -n '1,30p'
              exit 1
            fi
            echo "⚠️ 已移除打不上的补丁，重试"
          done
          [ "${_tkg_ok}" = "1" ] || { echo "❌ 重试多次仍失败"; exit 1; }
          cd /tmp/output/
          tar -I 'xz -T$(nproc) -9' -cvf "/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz" */
          cd ~/.cache/
          rm -rf /tmp/ccache.tar.xz
          tar -I 'xz -T$(nproc)' -cvf /tmp/ccache.tar.xz ccache
          echo "✅ Build completed and ccache archived."
          EOF
          sudo chmod +x build-wine.sh
          sudo mv build-wine.sh archlinux/bin/build-wine.sh
      - name: Restore ccache
        if: steps.need_build.outputs.new_release == 'true'
        uses: actions/cache/restore@v5
        with:
          path: /tmp/archlinux/tmp/ccache.tar.xz
          key: wine-tkg-ccache-Linux-x86_64
          restore-keys: |
            wine-tkg-ccache-Linux-x86_64
      - name: Compile Using BCC Chroot
        if: steps.need_build.outputs.new_release == 'true'
        run: |
          cd /tmp
          bash "$GITHUB_WORKSPACE/mount.sh" archlinux mount
          sudo chroot archlinux /bin/build-wine.sh
          bash "$GITHUB_WORKSPACE/mount.sh" archlinux unmount
          if [ ! -f "/tmp/archlinux/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz" ]; then
            echo "❌ Build output not found!"
            exit 1
          fi
          sudo chmod 644 "/tmp/archlinux/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz"
          sudo chmod 644 /tmp/archlinux/tmp/ccache.tar.xz
      - name: Save ccache
        if: steps.need_build.outputs.new_release == 'true' && github.run_attempt == 1
        uses: actions/cache/save@v5
        with:
          path: /tmp/archlinux/tmp/ccache.tar.xz
          key: wine-tkg-ccache-Linux-x86_64

      - name: Upload Source to wine-termux
        if: steps.need_build.outputs.new_release == 'true'
        run: |
          src_dir="/tmp/archlinux/tmp/wine-tkg/src/wine-git"
          if [ ! -d "$src_dir" ]; then
            echo "❌ Source directory not found: $src_dir"
            exit 1
          fi
          sudo chown -R $USER:$USER /tmp/archlinux/tmp/wine-tkg/src/wine-git
          cd /tmp/archlinux/tmp/wine-tkg/src/wine-git/
          sudo cp -r -p /tmp/archlinux/tmp/output/*/share/wine/wine-tkg-config.txt .
          sudo chmod 644 wine-tkg-config.txt
          sudo rm -rf .git
          cd "$src_dir"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch_name="${{ steps.wine_tag.outputs.wine_ver }}${{ steps.wine_tag.outputs.PKG_NAME }}"
          git checkout -b "$branch_name"
          git add .
          git commit -m "Auto-commit source for ${{ steps.wine_tag.outputs.wine_tag }} (PKG: ${{ steps.wine_tag.outputs.PKG_NAME }})"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/as14725836/wine-termux.git
          git push -f --set-upstream origin "$branch_name"
      - name: Create GitHub Release
        if: steps.need_build.outputs.new_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          target_commitish: ${{ steps.wine_tag.outputs.wine_ver }}${{ steps.wine_tag.outputs.PKG_NAME }}
          tag_name: ${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}
          name: Wine ${{ steps.wine_tag.outputs.wine_ver }} (${{ steps.wine_tag.outputs.PKG_NAME == 'mf' && 'mf' || 'dxgi' }}) TkG Staging GE
          body: |
            自动编译版本。
            [源码](https://github.com/as14725836/wine-termux/tree/${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }})
          files: /tmp/archlinux/tmp/wine-${{ steps.wine_tag.outputs.wine_ver }}-${{ steps.wine_tag.outputs.PKG_NAME }}-tkg-stg-ge.tar.xz
          draft: false
          prerelease: false

      - name: Save current tag to cache file
        if: steps.need_build.outputs.new_release == 'true'
        run: |
          cp .wine_current_tag .wine_last_tag
      - name: Update tag cache
        if: steps.need_build.outputs.new_release == 'true'
        uses: actions/cache@v4
        with:
          path: .wine_last_tag
          key: wine-last-tag
