name: Valve Proton ARM64EC - Termux glibc

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      proton_ref:
        description: 'Valve Proton branch/tag/commit'
        required: true
        default: 'proton_11.0'

      build_name:
        description: 'Proton build name'
        required: true
        default: 'proton-arm64ec-termux'

      unstripped:
        description: 'Build without stripping symbols'
        required: true
        type: boolean
        default: false

      jobs:
        description: 'Parallel build jobs'
        required: true
        default: '8'

  schedule:
    - cron: '0 0 1,15 * *'


env:
  # ============================================================
  # Valve Proton
  # ============================================================

  PROTON_REPO: https://github.com/ValveSoftware/Proton.git

  PROTON_REF: ${{ inputs.proton_ref || 'proton_11.0' }}

  BUILD_NAME: ${{ inputs.build_name || 'proton-arm64ec-termux' }}


  # ============================================================
  # ccache
  # ============================================================

  CCACHE_DIR: ${{ github.workspace }}/.ccache


  # ============================================================
  # Valve ARM64 SteamRT SDK
  # ============================================================

  STEAMRT_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm:4.0.20260331.220802-2


jobs:

  # ==============================================================
  # BUILD
  # ==============================================================

  build:

    name: Build Valve Proton ARM64 / ARM64EC

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 240


    steps:

      # ============================================================
      # Host information
      # ============================================================

      - name: Host information
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "HOST INFORMATION"
          echo "========================================"

          echo
          echo "Kernel:"
          uname -a

          echo
          echo "Architecture:"
          uname -m

          echo
          echo "CPU:"
          nproc

          lscpu || true

          echo
          echo "Memory:"
          free -h

          echo
          echo "Disk:"
          df -h


      # ============================================================
      # Checkout workflow repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Verify ARM64 runner
      # ============================================================

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euxo pipefail

          ARCH="$(uname -m)"

          if [ "$ARCH" != "aarch64" ]; then
            echo "::error::This Proton ARM64 build requires an ARM64/aarch64 runner."
            echo "Detected architecture: $ARCH"
            exit 1
          fi

          echo
          echo "ARM64 runner confirmed:"
          echo "$ARCH"


      # ============================================================
      # Install host dependencies
      #
      # IMPORTANT:
      #
      # Do NOT install docker.io.
      #
      # GitHub ARM runner already provides Docker.
      # Installing docker.io can conflict with containerd.io.
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            ca-certificates \
            rsync \
            file \
            jq \
            xz-utils \
            zstd \
            unzip \
            zip \
            python3 \
            python3-pip \
            ccache \
            build-essential

          sudo apt-get clean


      # ============================================================
      # Verify Docker
      # ============================================================

      - name: Verify Docker
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "DOCKER"
          echo "========================================"

          command -v docker

          docker --version

          echo
          echo "Docker info:"

          docker info

          echo
          echo "Docker server architecture:"

          docker version \
            --format '{{.Server.Arch}}'


      # ============================================================
      # Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}

          key: proton-arm64-${{ runner.arch }}-${{ env.PROTON_REF }}

          restore-keys: |
            proton-arm64-${{ runner.arch }}-
            proton-arm64-


      # ============================================================
      # Configure ccache
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$CCACHE_DIR"

          echo "========================================"
          echo "CCACHE"
          echo "========================================"

          ccache --version

          ccache \
            --set-config=cache_dir="$CCACHE_DIR"

          ccache \
            --set-config=max_size=5G

          ccache \
            --set-config=compression=true

          ccache -z

          echo
          echo "CCACHE_DIR:"
          echo "$CCACHE_DIR"


      # ============================================================
      # Clone Valve Proton
      # ============================================================

      - name: Clone Valve Proton
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf \
            proton \
            proton-build

          echo "========================================"
          echo "CLONE VALVE PROTON"
          echo "========================================"

          git clone \
            --filter=blob:none \
            --no-checkout \
            "$PROTON_REPO" \
            proton

          cd proton

          git fetch \
            --depth=1 \
            origin \
            "$PROTON_REF"

          git checkout \
            --detach \
            FETCH_HEAD

          git submodule update \
            --init \
            --recursive

          echo
          echo "========================================"
          echo "PROTON REVISION"
          echo "========================================"

          echo "Commit:"

          git rev-parse HEAD

          echo
          echo "Version:"

          git describe \
            --always \
            --tags \
            --dirty \
            || true

          echo
          echo "Ref:"
          echo "$PROTON_REF"


      # ============================================================
      # Verify Valve ARM64 source
      # ============================================================

      - name: Verify Valve ARM64 source
        shell: bash
        run: |
          set -euxo pipefail

          cd proton

          echo "========================================"
          echo "VALVE ARM64 SOURCE CHECK"
          echo "========================================"

          echo
          echo "TARGET_ARCH:"
          grep -n \
            'TARGET_ARCH' \
            Makefile.in \
            | head -50

          echo
          echo "========================================"
          echo "AARCH64 UNIX"
          echo "========================================"

          grep -n \
            'aarch64-unix' \
            Makefile.in \
            | head -30

          echo
          echo "========================================"
          echo "AARCH64 WINDOWS"
          echo "========================================"

          grep -n \
            'aarch64-windows' \
            Makefile.in \
            | head -30

          echo
          echo "========================================"
          echo "ARM64EC WINDOWS"
          echo "========================================"

          grep -n \
            'arm64ec-windows' \
            Makefile.in \
            | head -50

          echo
          echo "========================================"
          echo "FEX AARCH64"
          echo "========================================"

          grep -n \
            'FEX_aarch64' \
            Makefile.in \
            | head -30

          echo
          echo "========================================"
          echo "FEX ARM64EC"
          echo "========================================"

          grep -n \
            'FEX_arm64ec' \
            Makefile.in \
            | head -30


      # ============================================================
      # Configure Proton ARM64
      # ============================================================

      - name: Configure Proton ARM64
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf proton-build

          mkdir -p proton-build

          cd proton-build

          echo "========================================"
          echo "CONFIGURE PROTON"
          echo "========================================"

          ../proton/configure.sh \
            --target-arch=arm64 \
            --enable-ccache \
            --build-name="$BUILD_NAME"


      # ============================================================
      # Inspect generated configuration
      #
      # IMPORTANT:
      #
      # get-steamrt-image prints the recipe itself because make
      # echoes the command before executing it.
      #
      # Therefore:
      #
      # IMAGE="$(make get-steamrt-image)"
      #
      # is WRONG.
      #
      # We extract the actual registry URL from the output.
      # ============================================================

      - name: Inspect generated configuration
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile

          echo "========================================"
          echo "TARGET ARCH"
          echo "========================================"

          grep -n \
            'TARGET_ARCH' \
            Makefile \
            | head -50

          echo
          echo "========================================"
          echo "STEAMRT IMAGE"
          echo "========================================"

          make \
            --no-print-directory \
            get-steamrt-image \
            | tee steamrt-image.log

          IMAGE="$(
            grep -E \
              '^registry\.gitlab\.steamos\.cloud/' \
              steamrt-image.log \
              | tail -1
          )"

          if [ -z "$IMAGE" ]; then
            echo "::error::Failed to extract SteamRT image from make output."

            echo
            echo "Raw output:"
            cat steamrt-image.log

            exit 1
          fi

          echo
          echo "Resolved SteamRT:"
          echo "$IMAGE"

          echo
          echo "Expected SteamRT:"
          echo "$STEAMRT_IMAGE"

          if [ "$IMAGE" != "$STEAMRT_IMAGE" ]; then

            echo "::error::Configured SteamRT image differs from expected Valve ARM64 SDK."

            echo
            echo "Expected:"
            echo "$STEAMRT_IMAGE"

            echo
            echo "Actual:"
            echo "$IMAGE"

            echo
            echo "Raw make output:"
            cat steamrt-image.log

            exit 1
          fi

          echo
          echo "Valve ARM64 SteamRT confirmed."

          echo
          echo "========================================"
          echo "ARM64 SDK"
          echo "========================================"

          echo "$IMAGE" | grep \
            'arm64-llvm'

          echo
          echo "========================================"
          echo "ARM64EC SOURCE"
          echo "========================================"

          grep -n \
            'arm64ec-windows' \
            "$GITHUB_WORKSPACE/proton/Makefile.in" \
            | head -50


      # ============================================================
      # Test SteamRT container
      # ============================================================

      - name: Test Proton SteamRT container
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "TEST STEAMRT CONTAINER"
          echo "========================================"

          make \
            --no-print-directory \
            test-container


      # ============================================================
      # Print build configuration
      #
      # IMPORTANT:
      #
      # Again, parse the actual URL rather than assigning the
      # complete make output.
      # ============================================================

      - name: Print build configuration
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo
          echo "Runner:"
          uname -m

          echo
          echo "Proton ref:"
          echo "$PROTON_REF"

          echo
          echo "Build name:"
          echo "$BUILD_NAME"

          echo
          echo "SteamRT:"

          make \
            --no-print-directory \
            get-steamrt-image \
            | grep -E \
              '^registry\.gitlab\.steamos\.cloud/' \
            | tail -1

          echo
          echo "Jobs:"
          echo "${{ inputs.jobs || '8' }}"

          echo
          echo "Unstripped:"
          echo "${{ inputs.unstripped }}"

          echo
          echo "Target:"
          grep \
            -n \
            'TARGET_ARCH' \
            Makefile \
            | head -10

          echo
          echo "ccache:"

          ccache -s || true


      # ============================================================
      # Build Proton
      # ============================================================

      - name: Build Proton
        working-directory: proton-build
        shell: bash
        run: |
          set -o pipefail

          JOBS="${{ inputs.jobs || '8' }}"

          if ! [[ "$JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid jobs value: $JOBS"
            exit 1
          fi

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          echo
          echo "Parallel jobs:"
          echo "$JOBS"

          echo
          echo "Unstripped:"
          echo "${{ inputs.unstripped }}"

          if [ "${{ inputs.unstripped }}" = "true" ]; then

            make \
              -j"$JOBS" \
              UNSTRIPPED_BUILD=1 \
              2>&1 \
              | tee build.log

          else

            make \
              -j"$JOBS" \
              2>&1 \
              | tee build.log

          fi

          status="${PIPESTATUS[0]}"

          echo
          echo "make exit status: $status"

          if [ "$status" -ne 0 ]; then

            echo
            echo "========================================"
            echo "BUILD ERROR SUMMARY"
            echo "========================================"

            grep \
              -nEi \
              '(^|[^A-Za-z])(error:|error [0-9]+|failed|fatal error:|no rule to make target)' \
              build.log \
              | tail -150 \
              || true

            echo
            echo "========================================"
            echo "LAST 250 BUILD LINES"
            echo "========================================"

            tail -250 build.log

            exit "$status"
          fi


      # ============================================================
      # ccache statistics
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          echo "========================================"
          echo "CCACHE STATISTICS"
          echo "========================================"

          ccache -s || true


      # ============================================================
      # Create Proton redist
      # ============================================================

      - name: Create Proton redist
        working-directory: proton-build
        shell: bash
        run: |
          set -o pipefail

          JOBS="${{ inputs.jobs || '8' }}"

          echo "========================================"
          echo "CREATE PROTON REDIST"
          echo "========================================"

          if [ "${{ inputs.unstripped }}" = "true" ]; then

            make \
              -j"$JOBS" \
              UNSTRIPPED_BUILD=1 \
              redist \
              2>&1 \
              | tee redist.log

          else

            make \
              -j"$JOBS" \
              redist \
              2>&1 \
              | tee redist.log

          fi

          status="${PIPESTATUS[0]}"

          echo
          echo "redist exit status: $status"

          if [ "$status" -ne 0 ]; then

            echo
            echo "========================================"
            echo "REDIST ERROR SUMMARY"
            echo "========================================"

            grep \
              -nEi \
              '(^|[^A-Za-z])(error:|error [0-9]+|failed|fatal error:)' \
              redist.log \
              | tail -150 \
              || true

            echo
            echo "========================================"
            echo "LAST 250 REDIST LINES"
            echo "========================================"

            tail -250 redist.log

            exit "$status"
          fi

          echo
          echo "========================================"
          echo "REDIST BASIC CHECK"
          echo "========================================"

          test -d redist

          test -f redist/compatibilitytool.vdf

          test -f redist/proton

          echo "Proton redist created successfully."


      # ============================================================
      # Inspect redist
      # ============================================================

      - name: Inspect Proton redist
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "REDIST FILES"
          echo "========================================"

          find redist \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

          echo
          echo "========================================"
          echo "REDIST SIZE"
          echo "========================================"

          du -sh redist

          echo
          echo "========================================"
          echo "REDIST DIRECTORIES"
          echo "========================================"

          find redist \
            -maxdepth 2 \
            -type d \
            | sort \
            | head -200


      # ============================================================
      # Verify ARM64 ELF
      # ============================================================

      - name: Verify ARM64 ELF
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "AARCH64 ELF CHECK"
          echo "========================================"

          AARCH64_COUNT="$(
            find redist \
              -type f \
              -exec file {} \; \
              | grep -Ec \
                'ELF.*aarch64|ELF.*ARM aarch64' \
              || true
          )"

          echo
          echo "AArch64 ELF count:"
          echo "$AARCH64_COUNT"

          if [ "$AARCH64_COUNT" -eq 0 ]; then
            echo "::error::No AArch64 ELF binaries were found in Proton redist."
            exit 1
          fi

          echo
          echo "AArch64 examples:"

          find redist \
            -type f \
            -exec file {} \; \
            | grep -E \
              'ELF.*aarch64|ELF.*ARM aarch64' \
            | head -100


      # ============================================================
      # Verify ARM64EC / FEX artifacts
      # ============================================================

      - name: Verify ARM64EC and FEX artifacts
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ARM64 / ARM64EC ARTIFACTS"
          echo "========================================"

          find redist \
            -type f \
            | grep -Ei \
              'arm64|aarch64|arm64ec|fex' \
            | head -250 \
            || true

          echo
          echo "========================================"
          echo "FEX ARTIFACTS"
          echo "========================================"

          FEX_COUNT="$(
            find redist \
              -type f \
              | grep -Eic 'fex' \
              || true
          )"

          echo "FEX-related files:"
          echo "$FEX_COUNT"

          if [ "$FEX_COUNT" -eq 0 ]; then
            echo "::warning::No filename containing 'fex' was found in redist."
          fi


      # ============================================================
      # Generate Termux build information
      # ============================================================

      - name: Generate build info
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p \
            redist/termux

          PROTON_COMMIT="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              rev-parse HEAD
          )"

          PROTON_VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              describe \
              --always \
              --tags \
              2>/dev/null \
              || echo unknown
          )"

          STEAMRT="$(
            make \
              --no-print-directory \
              get-steamrt-image \
              | grep -E \
                '^registry\.gitlab\.steamos\.cloud/' \
              | tail -1
          )"

          BUILD_TIME="$(
            date -u \
              '+%Y-%m-%d %H:%M:%S UTC'
          )"

          printf '%s\n' \
            'Valve Proton ARM64 / ARM64EC' \
            '' \
            'Source:' \
            '  ValveSoftware/Proton' \
            "  Ref: $PROTON_REF" \
            "  Commit: $PROTON_COMMIT" \
            "  Version: $PROTON_VERSION" \
            '' \
            'Build:' \
            "  Name: $BUILD_NAME" \
            "  Time: $BUILD_TIME" \
            "  Runner: $(uname -m)" \
            '' \
            'Target:' \
            '  Linux AArch64' \
            '  Termux glibc' \
            '' \
            'Windows targets:' \
            '  i386' \
            '  x86_64' \
            '  aarch64' \
            '  ARM64EC' \
            '' \
            'SteamRT:' \
            "  $STEAMRT" \
            '' \
            'Build mode:' \
            "  Unstripped: ${{ inputs.unstripped }}" \
            '' \
            'Runtime:' \
            '  Linux/glibc' \
            '  NOT Android/Bionic' \
            '  Termux glibc runtime required' \
            '' \
            'Example loader:' \
            '  $PREFIX/glibc/lib/ld-linux-aarch64.so.1' \
            '' \
            'Note:' \
            '  This workflow does not patch Proton runtime paths for Termux.' \
            > redist/termux/README-TERMUX.txt

          echo
          echo "========================================"
          echo "TERMUX README"
          echo "========================================"

          cat \
            redist/termux/README-TERMUX.txt


      # ============================================================
      # Package Termux Proton
      # ============================================================

      - name: Package Termux Proton
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              describe \
              --always \
              --tags \
              2>/dev/null \
              || echo unknown
          )"

          SHORT_VERSION="${VERSION#proton-}"

          PACKAGE_NAME="${BUILD_NAME}-${SHORT_VERSION}"

          PACKAGE_DIR="$PWD/$PACKAGE_NAME"

          echo "========================================"
          echo "PACKAGE"
          echo "========================================"

          echo
          echo "Version:"
          echo "$VERSION"

          echo
          echo "Package:"
          echo "$PACKAGE_NAME"

          echo
          echo "Directory:"
          echo "$PACKAGE_DIR"

          rm -rf \
            "$PACKAGE_DIR"

          rm -f \
            "$PACKAGE_NAME.tar.xz" \
            "$PACKAGE_NAME.tar.xz.sha256"

          mkdir -p \
            "$PACKAGE_DIR/proton"

          cp -a \
            redist/. \
            "$PACKAGE_DIR/proton/"

          cp \
            redist/termux/README-TERMUX.txt \
            "$PACKAGE_DIR/README-TERMUX.txt"

          printf '%s\n' \
            'Valve Proton ARM64 / ARM64EC' \
            "Build: $BUILD_NAME" \
            "Version: $VERSION" \
            "Target: Linux AArch64 / Termux glibc" \
            "Commit: $(git -C "$GITHUB_WORKSPACE/proton" rev-parse HEAD)" \
            > "$PACKAGE_DIR/BUILD-INFO.txt"

          echo
          echo "Creating tar.xz..."

          tar \
            -cJf \
            "$PACKAGE_NAME.tar.xz" \
            "$PACKAGE_NAME"

          echo
          echo "Creating SHA256..."

          sha256sum \
            "$PACKAGE_NAME.tar.xz" \
            > "$PACKAGE_NAME.tar.xz.sha256"

          echo
          echo "========================================"
          echo "PACKAGE RESULT"
          echo "========================================"

          ls -lh \
            "$PACKAGE_NAME.tar.xz" \
            "$PACKAGE_NAME.tar.xz.sha256"

          echo
          echo "SHA256:"

          cat \
            "$PACKAGE_NAME.tar.xz.sha256"


      # ============================================================
      # Verify final package
      # ============================================================

      - name: Verify final package
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FINAL PACKAGE CHECK"
          echo "========================================"

          PACKAGE_FILE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*.tar.xz' \
              | head -1
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::No .tar.xz package found."
            exit 1
          fi

          SHA_FILE="${PACKAGE_FILE}.sha256"

          test -f "$SHA_FILE"

          echo
          echo "Package:"
          echo "$PACKAGE_FILE"

          echo
          echo "Checksum:"
          cat "$SHA_FILE"

          echo
          echo "Verifying checksum:"

          sha256sum \
            -c "$SHA_FILE"

          echo
          echo "Listing archive:"

          tar \
            -tJf \
            "$PACKAGE_FILE" \
            | head -100


      # ============================================================
      # Upload Proton redist
      # ============================================================

      - name: Upload Proton redist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-redist-arm64ec

          path: |
            proton-build/redist/**
            proton-build/build.log
            proton-build/redist.log

          if-no-files-found: error

          retention-days: 14


      # ============================================================
      # Upload Termux package
      # ============================================================

      - name: Upload Termux package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-termux-arm64ec

          path: |
            proton-build/*.tar.xz
            proton-build/*.tar.xz.sha256

          if-no-files-found: error

          retention-days: 30


      # ============================================================
      # Upload failure logs
      # ============================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proton-build-failure-logs

          path: |
            proton-build/build.log
            proton-build/redist.log
            proton-build/steamrt-image.log

          if-no-files-found: ignore

          retention-days: 14
