name: Valve Proton ARM64EC - Termux glibc

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:

      proton_ref:
        description: 'Valve Proton branch/tag/commit'
        required: true
        default: 'proton_11.0'

      build_name:
        description: 'Proton build name'
        required: true
        default: 'proton-arm64ec-termux'

      unstripped:
        description: 'Build without stripping symbols'
        required: true
        type: boolean
        default: false

      jobs:
        description: 'Parallel build jobs'
        required: true
        default: '8'

  schedule:
    - cron: '0 0 1,15 * *'


env:
  PROTON_REPO: https://github.com/ValveSoftware/Proton.git
  PROTON_REF: ${{ inputs.proton_ref || 'proton_11.0' }}

  BUILD_NAME: ${{ inputs.build_name || 'proton-arm64ec-termux' }}

  CCACHE_DIR: ${{ github.workspace }}/.ccache

  # Valve Proton ARM64 SteamRT SDK
  STEAMRT_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm:4.0.20260331.220802-2


jobs:

  build:

    name: Build Valve Proton ARM64 / ARM64EC

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 240


    steps:

      # ============================================================
      # Basic host information
      # ============================================================

      - name: Host information
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "HOST"
          echo "========================================"

          uname -a
          uname -m

          echo
          echo "CPU:"
          nproc
          lscpu || true

          echo
          echo "Memory:"
          free -h


      # ============================================================
      # Checkout workflow repository
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ============================================================
      # Verify ARM64 runner
      # ============================================================

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euxo pipefail

          ARCH="$(uname -m)"

          if [ "$ARCH" != "aarch64" ]; then
            echo "::error::This Proton ARM64 build requires an ARM64/aarch64 runner."
            echo "Detected: $ARCH"
            exit 1
          fi

          echo "ARM64 runner confirmed: $ARCH"


      # ============================================================
      # Host dependencies
      #
      # IMPORTANT:
      # Do NOT install docker.io.
      #
      # GitHub ARM runners already provide Docker.
      # Installing docker.io can conflict with containerd.io.
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            ca-certificates \
            rsync \
            file \
            jq \
            xz-utils \
            zstd \
            unzip \
            zip \
            python3 \
            python3-pip \
            ccache \
            build-essential

          sudo apt-get clean


      # ============================================================
      # Docker verification
      # ============================================================

      - name: Verify Docker
        shell: bash
        run: |
          set -euxo pipefail

          command -v docker
          docker --version

          echo
          docker info

          echo
          echo "Docker architecture:"
          docker version \
            --format '{{.Server.Arch}}'


      # ============================================================
      # ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: proton-arm64-${{ runner.arch }}-${{ env.PROTON_REF }}-${{ hashFiles('**/configure.sh', '**/Makefile.in') }}
          restore-keys: |
            proton-arm64-${{ runner.arch }}-${{ env.PROTON_REF }}-
            proton-arm64-${{ runner.arch }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --version

          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true

          ccache -z


      # ============================================================
      # Clone Valve Proton
      #
      # --no-checkout allows branch/tag/commit refs.
      # ============================================================

      - name: Clone Valve Proton
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf proton proton-build

          git clone \
            --filter=blob:none \
            --no-checkout \
            "$PROTON_REPO" \
            proton

          cd proton

          git fetch \
            --depth=1 \
            origin \
            "$PROTON_REF"

          git checkout --detach FETCH_HEAD

          git submodule update \
            --init \
            --recursive

          echo
          echo "========================================"
          echo "Proton revision"
          echo "========================================"

          git rev-parse HEAD

          git describe \
            --always \
            --tags \
            --dirty || true


      # ============================================================
      # Verify Valve ARM64 source support
      # ============================================================

      - name: Verify Valve ARM64 source
        shell: bash
        run: |
          set -euxo pipefail

          cd proton

          echo "========================================"
          echo "TARGET_ARCH"
          echo "========================================"

          grep -n \
            'TARGET_ARCH' \
            Makefile.in \
            | head -50

          echo
          echo "========================================"
          echo "ARM64 ARCHS"
          echo "========================================"

          grep -n \
            'aarch64-unix' \
            Makefile.in \
            | head -20

          grep -n \
            'aarch64-windows' \
            Makefile.in \
            | head -20

          grep -n \
            'arm64ec-windows' \
            Makefile.in \
            | head -20

          echo
          echo "========================================"
          echo "FEX"
          echo "========================================"

          grep -n \
            'FEX_aarch64' \
            Makefile.in \
            | head -20

          grep -n \
            'FEX_arm64ec' \
            Makefile.in \
            | head -20


      # ============================================================
      # Configure
      #
      # This is the official Valve ARM64 build path.
      # ============================================================

      - name: Configure Proton ARM64
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf proton-build
          mkdir -p proton-build

          cd proton-build

          ../proton/configure.sh \
            --target-arch=arm64 \
            --enable-ccache \
            --build-name="$BUILD_NAME"


      # ============================================================
      # Inspect generated configuration
      #
      # IMPORTANT:
      # Do NOT grep STEAMRT_IMAGE directly from Makefile.
      #
      # Valve provides get-steamrt-image specifically for this.
      # ============================================================

      - name: Inspect generated configuration
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile

          echo "========================================"
          echo "TARGET_ARCH"
          echo "========================================"

          grep -n \
            'TARGET_ARCH' \
            Makefile \
            | head -50

          echo
          echo "========================================"
          echo "STEAMRT IMAGE"
          echo "========================================"

          IMAGE="$(
            make \
              --no-print-directory \
              get-steamrt-image
          )"

          echo "$IMAGE"

          if [ "$IMAGE" != "$STEAMRT_IMAGE" ]; then
            echo "::warning::Configured SteamRT differs from expected value."
            echo "Expected:"
            echo "$STEAMRT_IMAGE"
            echo
            echo "Actual:"
            echo "$IMAGE"
          fi

          echo
          echo "========================================"
          echo "ARM64 SDK"
          echo "========================================"

          echo "$IMAGE" | grep 'arm64-llvm'

          echo
          echo "========================================"
          echo "ARM64EC source target"
          echo "========================================"

          grep -n \
            'arm64ec-windows' \
            "$GITHUB_WORKSPACE/proton/Makefile.in" \
            | head -50


      # ============================================================
      # Test SteamRT container
      # ============================================================

      - name: Test Proton SteamRT container
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          make \
            --no-print-directory \
            test-container


      # ============================================================
      # Print actual build configuration
      # ============================================================

      - name: Print build configuration
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "BUILD CONFIGURATION"
          echo "========================================"

          echo "Runner:"
          uname -m

          echo
          echo "Build name:"
          echo "$BUILD_NAME"

          echo
          echo "Proton ref:"
          echo "$PROTON_REF"

          echo
          echo "SteamRT:"
          make \
            --no-print-directory \
            get-steamrt-image

          echo
          echo "Jobs:"
          echo "${{ inputs.jobs || '8' }}"

          echo
          echo "Unstripped:"
          echo "${{ inputs.unstripped }}"


      # ============================================================
      # Build Proton
      # ============================================================

      - name: Build Proton
        working-directory: proton-build
        shell: bash
        run: |
          set -o pipefail

          JOBS="${{ inputs.jobs || '8' }}"

          echo "========================================"
          echo "BUILD START"
          echo "========================================"

          if [ "${{ inputs.unstripped }}" = "true" ]; then

            make \
              -j"$JOBS" \
              UNSTRIPPED_BUILD=1 \
              2>&1 \
              | tee build.log

          else

            make \
              -j"$JOBS" \
              2>&1 \
              | tee build.log

          fi

          status="${PIPESTATUS[0]}"

          echo
          echo "make exit status: $status"

          if [ "$status" -ne 0 ]; then

            echo
            echo "========================================"
            echo "LAST BUILD ERRORS"
            echo "========================================"

            grep \
              -nE \
              '(^|[^A-Za-z])(error:|Error [0-9]+|FAILED|fatal error:|No rule to make target)' \
              build.log \
              | tail -100 \
              || true

            echo
            echo "========================================"
            echo "LAST 200 LINES"
            echo "========================================"

            tail -200 build.log

            exit "$status"
          fi


      # ============================================================
      # ccache statistics
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true


      # ============================================================
      # Create official Proton redist
      # ============================================================

      - name: Create Proton redist
        working-directory: proton-build
        shell: bash
        run: |
          set -o pipefail

          JOBS="${{ inputs.jobs || '8' }}"

          echo "========================================"
          echo "REDIST"
          echo "========================================"

          if [ "${{ inputs.unstripped }}" = "true" ]; then

            make \
              -j"$JOBS" \
              UNSTRIPPED_BUILD=1 \
              redist \
              2>&1 \
              | tee redist.log

          else

            make \
              -j"$JOBS" \
              redist \
              2>&1 \
              | tee redist.log

          fi

          status="${PIPESTATUS[0]}"

          if [ "$status" -ne 0 ]; then

            echo
            echo "========================================"
            echo "REDIST ERRORS"
            echo "========================================"

            grep \
              -nE \
              '(^|[^A-Za-z])(error:|Error [0-9]+|FAILED|fatal error:)' \
              redist.log \
              | tail -100 \
              || true

            tail -200 redist.log

            exit "$status"
          fi

          test -d redist
          test -f redist/compatibilitytool.vdf
          test -f redist/proton


      # ============================================================
      # Inspect redist layout
      # ============================================================

      - name: Inspect Proton redist
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "REDIST FILES"
          echo "========================================"

          find redist \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -300

          echo
          echo "========================================"
          echo "REDIST SIZE"
          echo "========================================"

          du -sh redist


      # ============================================================
      # Verify ARM64 ELF binaries
      # ============================================================

      - name: Verify ARM64 ELF
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "ARM64 ELF"
          echo "========================================"

          find redist \
            -type f \
            -exec file {} \; \
            | grep \
              -E \
              'ARM aarch64|ARM64|AArch64' \
            | head -100 \
            || true


      # ============================================================
      # Verify Wine ARM64 directories
      # ============================================================

      - name: Verify ARM64 Wine layout
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "AARCH64 WINDOWS"
          echo "========================================"

          find redist \
            -type d \
            | grep \
              -E \
              'aarch64-windows|arm64ec' \
            | head -100 \
            || true

          echo
          echo "========================================"
          echo "AARCH64 UNIX"
          echo "========================================"

          find redist \
            -type d \
            | grep \
              'aarch64-unix' \
            | head -100 \
            || true


      # ============================================================
      # Verify FEX artifacts
      # ============================================================

      - name: Verify FEX ARM64EC artifacts
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "FEX / ARM64EC"
          echo "========================================"

          find redist \
            -type f \
            | grep \
              -Ei \
              'fex|arm64ec|aarch64' \
            | head -200 \
            || true


      # ============================================================
      # Generate build information
      # ============================================================

      - name: Generate build info
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p redist/termux

          PROTON_COMMIT="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              rev-parse HEAD
          )"

          PROTON_VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              describe \
              --always \
              --tags \
              2>/dev/null \
              || true
          )"

          STEAMRT="$(
            make \
              --no-print-directory \
              get-steamrt-image
          )"

          printf '%s\n' \
            'Valve Proton ARM64 / ARM64EC build' \
            '' \
            'Source:' \
            '  ValveSoftware/Proton' \
            "  Commit: $PROTON_COMMIT" \
            "  Version: $PROTON_VERSION" \
            '' \
            'Target:' \
            '  Linux AArch64' \
            '  Termux glibc' \
            '' \
            'Windows architectures:' \
            '  i386' \
            '  x86_64' \
            '  aarch64' \
            '  ARM64EC' \
            '' \
            'SteamRT:' \
            "  $STEAMRT" \
            '' \
            'Compiler architecture:' \
            '  arm64' \
            '' \
            'Important:' \
            '  This is a Linux/glibc Proton build.' \
            '  It is not an Android/Bionic build.' \
            '  Termux glibc runtime is required.' \
            '' \
            'Runtime loader example:' \
            '  $PREFIX/glibc/lib/ld-linux-aarch64.so.1' \
            '' \
            'The build does not automatically patch Proton runtime paths for Termux.' \
            > redist/termux/README-TERMUX.txt


      # ============================================================
      # Package
      # ============================================================

      - name: Package Termux Proton
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              describe \
              --always \
              --tags \
              2>/dev/null \
              || echo unknown
          )"

          PACKAGE_NAME="${BUILD_NAME}-${VERSION}-arm64ec-termux"

          rm -rf "$PACKAGE_NAME"

          mkdir -p "$PACKAGE/proton"

          cp -a \
            redist/. \
            "$PACKAGE/proton/"

          mkdir -p "$PACKAGE"

          printf '%s\n' \
            "Valve Proton ARM64 / ARM64EC" \
            "Build: $BUILD_NAME" \
            "Version: $VERSION" \
            "Target: Linux AArch64 / Termux glibc" \
            > "$PACKAGE/BUILD-INFO.txt"

          tar \
            -cJf \
            "$PACKAGE_NAME.tar.xz" \
            "$PACKAGE"

          sha256sum \
            "$PACKAGE_NAME.tar.xz" \
            > "$PACKAGE_NAME.tar.xz.sha256"

          echo
          echo "========================================"
          echo "PACKAGE"
          echo "========================================"

          ls -lh \
            "$PACKAGE_NAME.tar.xz" \
            "$PACKAGE_NAME.tar.xz.sha256"

          echo
          sha256sum \
            "$PACKAGE_NAME.tar.xz"


      # ============================================================
      # Upload build artifacts
      # ============================================================

      - name: Upload Proton redist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-redist-arm64ec
          path: |
            proton-build/redist/**
            proton-build/build.log
            proton-build/redist.log
          if-no-files-found: error
          retention-days: 14


      - name: Upload Termux package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-termux-arm64ec
          path: |
            proton-build/*.tar.xz
            proton-build/*.tar.xz.sha256
          if-no-files-found: error
          retention-days: 30


      # ============================================================
      # Upload logs if anything failed
      # ============================================================

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proton-build-failure-logs
          path: |
            proton-build/build.log
            proton-build/redist.log
          if-no-files-found: ignore
          retention-days: 14
