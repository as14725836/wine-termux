name: Valve Proton ARM64EC - Termux glibc

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      proton_ref:
        description: 'Valve Proton branch/tag/commit'
        required: true
        default: 'proton_11.0'

      build_name:
        description: 'Proton build name'
        required: true
        default: 'protonwine'

      unstripped:
        description: 'Build without stripping symbols'
        required: true
        type: boolean
        default: false

      jobs:
        description: 'Parallel build jobs'
        required: true
        default: '8'

  schedule:
    - cron: '0 0 1,15 * *'

env:
  PROTON_REPO: https://github.com/ValveSoftware/Proton.git
  PROTON_REF: ${{ inputs.proton_ref || 'proton_11.0' }}
  BUILD_NAME: ${{ inputs.build_name || 'protonwine' }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  STEAMRT_IMAGE: registry.gitlab.steamos.cloud/proton/steamrt4/sdk/arm64-llvm:4.0.20260331.220802-2

jobs:

  build:

    name: Build Valve Proton ARM64 / ARM64EC

    runs-on: ubuntu-24.04-arm

    timeout-minutes: 240

    steps:

      # ============================================================
      # Host information
      # ============================================================

      - name: Host information
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "HOST INFORMATION"
          echo "========================================"

          uname -a
          echo
          uname -m
          echo
          nproc
          lscpu || true
          echo
          free -h
          echo
          df -h

      # ============================================================
      # Checkout
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # Verify ARM64 runner
      # ============================================================

      - name: Verify ARM64 runner
        shell: bash
        run: |
          set -euxo pipefail

          ARCH="$(uname -m)"

          if [ "$ARCH" != "aarch64" ]; then
            echo "::error::This Proton ARM64 build requires an ARM64/aarch64 runner."
            echo "Detected architecture: $ARCH"
            exit 1
          fi

          echo "ARM64 runner confirmed: $ARCH"

      # ============================================================
      # Install host dependencies
      # ============================================================

      - name: Install host dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            curl \
            wget \
            ca-certificates \
            rsync \
            file \
            jq \
            xz-utils \
            zstd \
            unzip \
            zip \
            python3 \
            python3-pip \
            ccache \
            build-essential \
            llvm \
            patchelf

          sudo apt-get clean

      # ============================================================
      # Verify Docker
      # ============================================================

      - name: Verify Docker
        shell: bash
        run: |
          set -euxo pipefail

          command -v docker
          docker --version
          echo
          docker info
          echo
          docker version --format '{{.Server.Arch}}'

      # ============================================================
      # Restore ccache
      # ============================================================

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}

          key: proton-arm64-${{ runner.arch }}-${{ env.PROTON_REF }}

          restore-keys: |
            proton-arm64-${{ runner.arch }}-
            proton-arm64-

      # ============================================================
      # Configure ccache
      # ============================================================

      - name: Configure ccache
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --version
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compression=true
          ccache -z

          echo "CCACHE_DIR: $CCACHE_DIR"

      # ============================================================
      # Clone Valve Proton
      # ============================================================

      - name: Clone Valve Proton
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf proton proton-build

          git clone \
            --filter=blob:none \
            --no-checkout \
            "$PROTON_REPO" \
            proton

          cd proton

          git fetch \
            --depth=1 \
            origin \
            "$PROTON_REF"

          git checkout \
            --detach \
            FETCH_HEAD

          git submodule update \
            --init \
            --recursive

          echo "Commit: $(git rev-parse HEAD)"
          echo "Version: $(git describe --always --tags --dirty || true)"
          echo "Ref: $PROTON_REF"

      # ============================================================
      # Patch Wine source: /tmp -> Termux tmp
      # ============================================================

      - name: Patch Wine source (/tmp -> Termux tmp)
        working-directory: proton
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /data/data/com.termux/files/usr/tmp
          chmod 1777 /data/data/com.termux/files/usr/tmp

          TERMUX_TMP="/data/data/com.termux/files/usr/tmp"

          echo "========================================"
          echo "PATCH WINE /tmp -> $TERMUX_TMP"
          echo "========================================"

          WINE_DIR=""
          for cand in \
            subprojects/wine \
            wine \
            subprojects/wine-proton ; do
            if [ -d "$cand" ]; then
              WINE_DIR="$cand"
              break
            fi
          done

          if [ -z "$WINE_DIR" ]; then
            echo "::error::Wine source directory not found."
            echo "Looked for: subprojects/wine, wine, subprojects/wine-proton"
            ls -la subprojects/ || true
            exit 1
          fi

          echo "Wine source: $WINE_DIR"

          echo
          echo "BEFORE: /tmp occurrences"

          BEFORE_COUNT="$(
            find "$WINE_DIR" \
              -type f \
              \( -name '*.c' -o -name '*.h' -o -name '*.in' -o -name '*.spec' \) \
              -exec grep -l '/tmp' {} \; \
              | wc -l
          )"

          echo "Files containing /tmp: $BEFORE_COUNT"

          echo
          echo "PATCH 1: /tmp/ -> $TERMUX_TMP/"

          find "$WINE_DIR" \
            -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.in' -o -name '*.spec' \) \
            -exec grep -l '/tmp' {} \; \
            | xargs -r \
              sed -i "s|/tmp/|${TERMUX_TMP}/|g"

          echo
          echo "PATCH 2: \"/tmp\" -> \"$TERMUX_TMP\""

          find "$WINE_DIR" \
            -type f \
            \( -name '*.c' -o -name '*.h' -o -name '*.in' -o -name '*.spec' \) \
            -exec grep -l '"/tmp"' {} \; \
            | xargs -r \
              sed -i "s|\"/tmp\"|\"${TERMUX_TMP}\"|g"

          echo
          echo "PATCH 3: server/ directory"

          if [ -d "$WINE_DIR/server" ]; then
            find "$WINE_DIR/server" \
              -type f \
              \( -name '*.c' -o -name '*.h' \) \
              -exec sed -i \
                "s|\"/tmp\"|\"${TERMUX_TMP}\"|g" {} + \
              || true
          else
            echo "warn: $WINE_DIR/server not found"
          fi

          echo
          echo "PATCH 4: file.c / loader.c / server.c"

          for fname in file.c loader.c server.c; do
            find "$WINE_DIR" \
              -name "$fname" \
              -type f \
              -exec sed -i \
                "s|\"/tmp\"|\"${TERMUX_TMP}\"|g" {} + \
              2>/dev/null || true
          done

          echo
          echo "AFTER: remaining /tmp occurrences"

          REMAINING="$(
            find "$WINE_DIR" \
              -type f \
              \( -name '*.c' -o -name '*.h' -o -name '*.in' -o -name '*.spec' \) \
              -exec grep -l '/tmp' {} \; \
              | sort
          )"

          if [ -z "$REMAINING" ]; then
            echo "No /tmp references remaining in Wine source."
          else
            echo "Files still containing /tmp:"
            echo "$REMAINING"

            echo
            echo "Remaining /tmp lines (first 200):"
            echo "$REMAINING" \
              | while read -r f; do
                  grep -n '/tmp' "$f" || true
                done \
              | awk 'NR<=200'
          fi

      # ============================================================
      # Verify Valve ARM64 source
      # ============================================================

      - name: Verify Valve ARM64 source
        working-directory: proton
        shell: bash
        run: |
          set -euxo pipefail

          echo "TARGET_ARCH:"
          grep -n -m 50 'TARGET_ARCH' Makefile.in || true

          echo
          echo "AARCH64 UNIX:"
          grep -n -m 30 'aarch64-unix' Makefile.in || true

          echo
          echo "AARCH64 WINDOWS:"
          grep -n -m 30 'aarch64-windows' Makefile.in || true

          echo
          echo "ARM64EC WINDOWS:"
          grep -n -m 50 'arm64ec-windows' Makefile.in || true

          echo
          echo "FEX AARCH64:"
          grep -n -m 30 'FEX_aarch64' Makefile.in || true

          echo
          echo "FEX ARM64EC:"
          grep -n -m 30 'FEX_arm64ec' Makefile.in || true

      # ============================================================
      # Configure Proton ARM64
      # ============================================================

      - name: Configure Proton ARM64
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf proton-build
          mkdir -p proton-build

          cd proton-build

          ../proton/configure.sh \
            --target-arch=arm64 \
            --enable-ccache \
            --build-name="$BUILD_NAME"

      # ============================================================
      # Inspect generated configuration
      # ============================================================

      - name: Inspect generated configuration
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          test -f Makefile

          echo "TARGET ARCH:"
          grep -n -m 50 'TARGET_ARCH' Makefile || true

          echo
          echo "STEAMRT IMAGE:"

          make \
            --no-print-directory \
            get-steamrt-image \
            | tee steamrt-image.log

          IMAGE="$(
            grep -E \
              '^registry\.gitlab\.steamos\.cloud/' \
              steamrt-image.log \
              | tail -1
          )"

          if [ -z "$IMAGE" ]; then
            echo "::error::Failed to extract SteamRT image from make output."
            cat steamrt-image.log
            exit 1
          fi

          echo "Resolved: $IMAGE"
          echo "Expected: $STEAMRT_IMAGE"

          if [ "$IMAGE" != "$STEAMRT_IMAGE" ]; then
            echo "::error::Configured SteamRT image differs from expected."
            echo "Expected: $STEAMRT_IMAGE"
            echo "Actual:   $IMAGE"
            cat steamrt-image.log
            exit 1
          fi

          echo "Valve ARM64 SteamRT confirmed."

          echo
          echo "ARM64EC SOURCE:"
          grep -n -m 50 \
            'arm64ec-windows' \
            "$GITHUB_WORKSPACE/proton/Makefile.in" \
            || true

      # ============================================================
      # Test SteamRT container
      # ============================================================

      - name: Test Proton SteamRT container
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          make --no-print-directory test-container

      # ============================================================
      # Print build configuration
      # ============================================================

      - name: Print build configuration
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "Runner:     $(uname -m)"
          echo "Proton ref: $PROTON_REF"
          echo "Build name: $BUILD_NAME"

          echo
          echo "SteamRT:"
          make \
            --no-print-directory \
            get-steamrt-image \
            | grep -E \
              '^registry\.gitlab\.steamos\.cloud/' \
            | tail -1

          echo
          echo "Jobs:       ${{ inputs.jobs || '8' }}"
          echo "Unstripped: ${{ inputs.unstripped }}"

          echo
          echo "Target:"
          grep -n -m 10 'TARGET_ARCH' Makefile || true

          echo
          echo "ccache:"
          ccache -s || true

      # ============================================================
      # Build Proton
      # ============================================================

      - name: Build Proton
        working-directory: proton-build
        shell: bash
        run: |
          set -o pipefail

          JOBS="${{ inputs.jobs || '8' }}"

          if ! [[ "$JOBS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid jobs value: $JOBS"
            exit 1
          fi

          echo "Parallel jobs: $JOBS"
          echo "Unstripped:    ${{ inputs.unstripped }}"

          if [ "${{ inputs.unstripped }}" = "true" ]; then
            make -j"$JOBS" UNSTRIPPED_BUILD=1 2>&1 | tee build.log
          else
            make -j"$JOBS" 2>&1 | tee build.log
          fi

          status="${PIPESTATUS[0]}"

          echo "make exit status: $status"

          if [ "$status" -ne 0 ]; then
            echo "BUILD ERROR SUMMARY"
            grep \
              -nEi \
              '(^|[^A-Za-z])(error:|error [0-9]+|failed|fatal error:|no rule to make target)' \
              build.log \
              | tail -150 \
              || true

            echo
            echo "LAST 250 BUILD LINES"
            tail -250 build.log

            exit "$status"
          fi

      # ============================================================
      # ccache statistics
      # ============================================================

      - name: Show ccache statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true

      # ============================================================
      # Create Proton redist
      # ============================================================

      - name: Create Proton redist
        working-directory: proton-build
        shell: bash
        run: |
          set -o pipefail

          JOBS="${{ inputs.jobs || '8' }}"

          if [ "${{ inputs.unstripped }}" = "true" ]; then
            make -j"$JOBS" UNSTRIPPED_BUILD=1 redist 2>&1 | tee redist.log
          else
            make -j"$JOBS" redist 2>&1 | tee redist.log
          fi

          status="${PIPESTATUS[0]}"

          echo "redist exit status: $status"

          if [ "$status" -ne 0 ]; then
            echo "REDIST ERROR SUMMARY"
            grep \
              -nEi \
              '(^|[^A-Za-z])(error:|error [0-9]+|failed|fatal error:)' \
              redist.log \
              | tail -150 \
              || true

            echo
            echo "LAST 250 REDIST LINES"
            tail -250 redist.log

            exit "$status"
          fi

          test -d redist
          test -f redist/compatibilitytool.vdf
          test -f redist/proton

          echo "Proton redist created successfully."

      # ============================================================
      # Slim redist (Wine + FEX + DXVK/VKD3D) and strip
      # ============================================================

      - name: Slim redist and strip
        if: ${{ inputs.unstripped != true }}
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "SIZE BEFORE SLIM:"
          du -sh redist

          echo
          echo "Top 20 largest before slim:"
          find redist -type f -printf '%s %p\n' \
            | sort -rn \
            | awk 'NR<=20 {printf "%8.2f MB  %s\n", $1/1024/1024, $2}'

          find redist -type f -name '*.debug' -delete || true

          rm -rf redist/files/lib*/gstreamer-1.0 || true
          find redist/files/lib* -maxdepth 1 -name 'libgst*.so*' -delete || true

          # 可选：删除 DXVK / VKD3D（默认保留）
          # rm -rf redist/files/lib*/wine/dxvk || true
          # rm -rf redist/files/lib*/wine/vkd3d || true

          find redist -type f \( -name '*.a' -o -name '*.la' \) -delete || true

          find redist -type d -name 'include' -prune -exec rm -rf {} + 2>/dev/null || true
          find redist -type d -name 'pkgconfig' -prune -exec rm -rf {} + 2>/dev/null || true
          find redist -type d -name 'cmake' -prune -exec rm -rf {} + 2>/dev/null || true

          echo
          echo "Stripping ELF / PE..."

          find redist -type f \
            \( -name '*.so' -o -name '*.so.*' \
            -o -name '*.dll' -o -name '*.exe' \
            -o -name '*.dll.so' \) \
            -exec llvm-strip --strip-unneeded {} \; 2>/dev/null || true

          find redist -type f -executable ! -name '*.*' \
            -exec llvm-strip --strip-unneeded {} \; 2>/dev/null || true

          echo
          echo "SIZE AFTER SLIM:"
          du -sh redist

          echo
          echo "Top 20 largest after slim:"
          find redist -type f -printf '%s %p\n' \
            | sort -rn \
            | awk 'NR<=20 {printf "%8.2f MB  %s\n", $1/1024/1024, $2}'

      # ============================================================
      # Verify ARM64 ELF
      # ============================================================

      - name: Verify ARM64 ELF
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          AARCH64_COUNT="$(
            find redist \
              -type f \
              -exec file {} \; \
              | grep -Ec \
                'ELF.*aarch64|ELF.*ARM aarch64' \
              || true
          )"

          echo "AArch64 ELF count: $AARCH64_COUNT"

          if [ "$AARCH64_COUNT" -eq 0 ]; then
            echo "::error::No AArch64 ELF binaries found."
            exit 1
          fi

          echo
          echo "AArch64 examples:"
          find redist \
            -type f \
            -exec file {} \; \
            | grep -E -m 100 \
              'ELF.*aarch64|ELF.*ARM aarch64' \
            || true

      # ============================================================
      # Verify ARM64EC / FEX artifacts
      # ============================================================

      - name: Verify ARM64EC and FEX artifacts
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          echo "ARM64 / ARM64EC ARTIFACTS:"
          find redist \
            -type f \
            | grep -Ei -m 250 \
              'arm64|aarch64|arm64ec|fex' \
            || true

          echo
          echo "FEX ARTIFACTS:"

          FEX_COUNT="$(
            find redist \
              -type f \
              | grep -Eic 'fex' \
              || true
          )"

          echo "FEX-related files: $FEX_COUNT"

          if [ "$FEX_COUNT" -eq 0 ]; then
            echo "::warning::No filename containing 'fex' was found."
          fi

      # ============================================================
      # Generate Termux build info
      # ============================================================

      - name: Generate build info
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p redist/termux

          PROTON_COMMIT="$(
            git -C "$GITHUB_WORKSPACE/proton" rev-parse HEAD
          )"

          PROTON_VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              describe --always --tags 2>/dev/null \
              || echo unknown
          )"

          STEAMRT="$(
            make --no-print-directory get-steamrt-image \
              | grep -E '^registry\.gitlab\.steamos\.cloud/' \
              | tail -1
          )"

          BUILD_TIME="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          {
            printf '%s\n' 'Valve Proton ARM64 / ARM64EC'
            printf '%s\n' ''
            printf '%s\n' 'Source:'
            printf '%s\n' '  ValveSoftware/Proton'
            printf '%s\n' "  Ref: $PROTON_REF"
            printf '%s\n' "  Commit: $PROTON_COMMIT"
            printf '%s\n' "  Version: $PROTON_VERSION"
            printf '%s\n' ''
            printf '%s\n' 'Build:'
            printf '%s\n' "  Name: $BUILD_NAME"
            printf '%s\n' "  Time: $BUILD_TIME"
            printf '%s\n' "  Runner: $(uname -m)"
            printf '%s\n' ''
            printf '%s\n' 'Target:'
            printf '%s\n' '  Linux AArch64'
            printf '%s\n' '  Termux glibc'
            printf '%s\n' ''
            printf '%s\n' 'Termux patches:'
            printf '%s\n' '  Wine source /tmp -> /data/data/com.termux/files/usr/tmp'
            printf '%s\n' '  Applied to: subprojects/wine/**/*.{c,h,in,spec}'
            printf '%s\n' '  Special handling: server/, file.c, loader.c, server.c'
            printf '%s\n' ''
            printf '%s\n' 'Package layout:'
            printf '%s\n' '  bin/     wine 可执行'
            printf '%s\n' '  lib/     Wine 运行库 + wine/ 子目录'
            printf '%s\n' '  lib64/   64 位库'
            printf '%s\n' '  share/   Wine 数据（nls/fonts）'
            printf '%s\n' '  libexec/ FEX 等辅助程序'
            printf '%s\n' '  proton   Termux glibc 启动脚本'
            printf '%s\n' ''
            printf '%s\n' 'Windows targets:'
            printf '%s\n' '  i386'
            printf '%s\n' '  x86_64'
            printf '%s\n' '  aarch64'
            printf '%s\n' '  ARM64EC'
            printf '%s\n' ''
            printf '%s\n' 'SteamRT:'
            printf '%s\n' "  $STEAMRT"
            printf '%s\n' ''
            printf '%s\n' 'Build mode:'
            printf '%s\n' "  Unstripped: ${{ inputs.unstripped }}"
            printf '%s\n' ''
            printf '%s\n' 'Slimming:'
            printf '%s\n' '  GStreamer: removed'
            printf '%s\n' '  Debug symbols (.debug): removed'
            printf '%s\n' '  Static libs (.a/.la): removed'
            printf '%s\n' '  Headers/pkgconfig/cmake: removed'
            printf '%s\n' '  Binaries: stripped with llvm-strip'
            printf '%s\n' ''
            printf '%s\n' 'Runtime:'
            printf '%s\n' '  Linux/glibc'
            printf '%s\n' '  NOT Android/Bionic'
            printf '%s\n' '  Termux glibc runtime required'
            printf '%s\n' ''
            printf '%s\n' 'Example loader:'
            printf '%s\n' '  $PREFIX/glibc/lib/ld-linux-aarch64.so.1'
          } > redist/termux/README-TERMUX.txt

          cat redist/termux/README-TERMUX.txt

      # ============================================================
      # Package Termux Proton (FLATTENED - no files/)
      # ============================================================

      - name: Package Termux Proton (flattened)
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="$(
            git \
              -C "$GITHUB_WORKSPACE/proton" \
              describe --always --tags 2>/dev/null \
              || echo unknown
          )"

          SHORT_VERSION="${VERSION#proton-}"
          PACKAGE_NAME="${BUILD_NAME}-${SHORT_VERSION}"
          PACKAGE_DIR="$PWD/$PACKAGE_NAME"

          echo "Version: $VERSION"
          echo "Package: $PACKAGE_NAME"

          rm -rf "$PACKAGE_DIR"
          rm -f  "$PACKAGE_NAME.tar.xz" "$PACKAGE_NAME.tar.xz.sha256"

          mkdir -p "$PACKAGE_DIR"

          # 展平 files/*
          for d in bin lib lib64 share libexec include; do
            if [ -d "redist/files/$d" ]; then
              cp -a "redist/files/$d" "$PACKAGE_DIR/$d"
              echo "copied: $d"
            fi
          done

          # 改写 redist/proton -> 顶层 proton
          if [ ! -f redist/proton ]; then
            echo "::error::redist/proton not found."
            exit 1
          fi

          cp redist/proton "$PACKAGE_DIR/proton"

          sed -i \
            -e 's|\$HERE/files|\$HERE|g' \
            -e 's|\${HERE}/files|\${HERE}|g' \
            -e 's|"\$STEAM_COMPAT_TOOL_PATH/files|"$STEAM_COMPAT_TOOL_PATH|g' \
            -e 's|/files/bin|/bin|g' \
            -e 's|/files/lib|/lib|g' \
            -e 's|/files/lib64|/lib64|g' \
            -e 's|/files/share|/share|g' \
            -e 's|/files/libexec|/libexec|g' \
            "$PACKAGE_DIR/proton"

          # 改 shebang 为 Termux bash
          sed -i \
            '1s|^#!.*bash.*|#!/data/data/com.termux/files/usr/bin/bash|' \
            "$PACKAGE_DIR/proton"

          chmod +x "$PACKAGE_DIR/proton"

          echo
          echo "Remaining 'files/' references in proton script:"
          grep -n 'files/' "$PACKAGE_DIR/proton" || echo "  (none)"

          echo
          echo "proton shebang:"
          head -1 "$PACKAGE_DIR/proton"

          # 丢弃 Steam 专用元数据
          rm -f "$PACKAGE_DIR/compatibilitytool.vdf" || true
          rm -f "$PACKAGE_DIR/toolmanifest.vdf"     || true
          rm -f "$PACKAGE_DIR/version"              || true

          # ------------------------------------------------------------
          # Termux glibc wrapper（printf 逐行写，避免 heredoc 缩进问题）
          # ------------------------------------------------------------
          WRAPPER="$PACKAGE_DIR/proton-termux"

          {
            printf '%s\n' '#!/data/data/com.termux/files/usr/bin/bash'
            printf '%s\n' 'set -e'
            printf '%s\n' ''
            printf '%s\n' 'SELF="$0"'
            printf '%s\n' 'while [ -h "$SELF" ]; do'
            printf '%s\n' '  DIR="$(cd -P "$(dirname "$SELF")" && pwd)"'
            printf '%s\n' '  SELF="$(readlink "$SELF")"'
            printf '%s\n' '  case "$SELF" in'
            printf '%s\n' '    /*) ;;'
            printf '%s\n' '    *) SELF="$DIR/$SELF" ;;'
            printf '%s\n' '  esac'
            printf '%s\n' 'done'
            printf '%s\n' ''
            printf '%s\n' 'PROTON_HOME="${PROTON_HOME:-$(cd -P "$(dirname "$SELF")" && pwd)}"'
            printf '%s\n' ''
            printf '%s\n' 'TERMUX_GLIBC="${TERMUX_GLIBC:-${PREFIX:-/data/data/com.termux/files/usr}/glibc}"'
            printf '%s\n' 'LOADER="$TERMUX_GLIBC/lib/ld-linux-aarch64.so.1"'
            printf '%s\n' ''
            printf '%s\n' 'if [ ! -x "$LOADER" ]; then'
            printf '%s\n' '  echo "error: Termux glibc loader not found: $LOADER" >&2'
            printf '%s\n' '  echo "hint:  install glibc runtime, or set TERMUX_GLIBC" >&2'
            printf '%s\n' '  exit 1'
            printf '%s\n' 'fi'
            printf '%s\n' ''
            printf '%s\n' 'export PROTON_HOME'
            printf '%s\n' 'export WINEDLLPATH="$PROTON_HOME/lib/wine:$PROTON_HOME/lib64/wine"'
            printf '%s\n' 'export LD_LIBRARY_PATH="$PROTON_HOME/lib:$PROTON_HOME/lib64:${LD_LIBRARY_PATH:-}"'
            printf '%s\n' 'export WINEPREFIX="${WINEPREFIX:-$HOME/.wine-proton}"'
            printf '%s\n' ''
            printf '%s\n' 'TERMUX_BASH="${TERMUX_BASH:-/data/data/com.termux/files/usr/bin/bash}"'
            printf '%s\n' ''
            printf '%s\n' 'exec "$TERMUX_BASH" "$PROTON_HOME/proton" "$@"'
          } > "$WRAPPER"

          chmod +x "$WRAPPER"

          cp redist/termux/README-TERMUX.txt "$PACKAGE_DIR/README-TERMUX.txt"

          {
            printf '%s\n' 'Valve Proton ARM64 / ARM64EC'
            printf '%s\n' "Build:   $BUILD_NAME"
            printf '%s\n' "Version: $VERSION"
            printf '%s\n' 'Target:  Linux AArch64 / Termux glibc'
            printf '%s\n' "Commit:  $(git -C "$GITHUB_WORKSPACE/proton" rev-parse HEAD)"
            printf '%s\n' ''
            printf '%s\n' 'Termux patches:'
            printf '%s\n' '  Wine /tmp -> /data/data/com.termux/files/usr/tmp'
            printf '%s\n' ''
            printf '%s\n' 'Layout (flattened, no files/):'
            printf '%s\n' '  bin/       wine 可执行'
            printf '%s\n' '  lib/       Wine 运行库 + wine/ 子目录'
            printf '%s\n' '  lib64/     64 位库'
            printf '%s\n' '  share/     Wine 数据（nls/fonts）'
            printf '%s\n' '  libexec/   FEX 等辅助程序'
            printf '%s\n' '  proton     官方 Proton 启动脚本（路径已改写）'
            printf '%s\n' '  proton-termux  Termux glibc 直接启动 wrapper'
          } > "$PACKAGE_DIR/BUILD-INFO.txt"

          echo
          echo "Creating tar.xz..."

          XZ_OPT='-9e -T0' \
            tar \
              -cJf \
              "$PACKAGE_NAME.tar.xz" \
              "$PACKAGE_NAME"

          echo
          echo "Creating SHA256..."

          sha256sum \
            "$PACKAGE_NAME.tar.xz" \
            > "$PACKAGE_NAME.tar.xz.sha256"

          echo
          echo "PACKAGE RESULT:"
          ls -lh "$PACKAGE_NAME.tar.xz" "$PACKAGE_NAME.tar.xz.sha256"

          echo
          echo "SHA256:"
          cat "$PACKAGE_NAME.tar.xz.sha256"

          echo
          echo "PACKAGE TREE (top level):"
          ls -la "$PACKAGE_DIR"

      # ============================================================
      # Verify final package
      # ============================================================

      - name: Verify final package
        working-directory: proton-build
        shell: bash
        run: |
          set -euxo pipefail

          PACKAGE_FILE="$(
            find . \
              -maxdepth 1 \
              -type f \
              -name '*.tar.xz' \
              | awk 'NR==1'
          )"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "::error::No .tar.xz package found."
            exit 1
          fi

          SHA_FILE="${PACKAGE_FILE}.sha256"
          test -f "$SHA_FILE"

          echo "Package:  $PACKAGE_FILE"
          echo "Checksum: $(cat "$SHA_FILE")"

          echo
          echo "Verifying checksum:"
          sha256sum -c "$SHA_FILE"

          echo
          echo "Listing archive:"
          tar -tJf "$PACKAGE_FILE" | awk 'NR<=120'

      # ============================================================
      # Upload Termux package
      # ============================================================

      - name: Upload Termux package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}-termux-arm64ec

          path: |
            proton-build/*.tar.xz
            proton-build/*.tar.xz.sha256

          if-no-files-found: error

          retention-days: 30

      # ============================================================
      # Upload failure logs
      # ============================================================

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proton-build-failure-logs

          path: |
            proton-build/build.log
            proton-build/redist.log
            proton-build/steamrt-image.log

          if-no-files-found: ignore

          retention-days: 14
