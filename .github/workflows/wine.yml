name: Build Wine ARM64 WOW64 (BCC Arch chroot, arm64ec)

on:
  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine 构建类型'
        required: false
        default: 'proton'
        type: choice
        options:
          - proton
          - staging
          - winearm64ec
          - pipetto-proton9-arm64ec
          - proton-10.34-GE
          - proton-gamenative
          - valve-wine
          - valve-proton

      wine_version:
        description: 'Wine 版本，例如 11.19；latest 表示源码默认'
        required: false
        default: 'latest'
        type: string

      proton_branch:
        description: 'Proton Wine 分支'
        required: false
        default: 'proton_11.0'
        type: string

      proton_commit:
        description: 'Proton commit，可留空'
        required: false
        default: ''
        type: string

      gamenative_branch:
        description: 'GameNative proton-wine 分支 (wine_branch=proton-gamenative)'
        required: false
        default: 'proton_11.0-2'
        type: string

      valve_repo:
        description: 'Valve Wine 源码仓库 (wine_branch=valve-wine)'
        required: false
        default: 'https://github.com/ValveSoftware/wine.git'
        type: string

      valve_branch:
        description: 'Valve 分支 (valve-wine / valve-proton)'
        required: false
        default: 'experimental_10.0'
        type: string

      staging_version:
        description: 'Wine-Staging 版本，留空自动匹配'
        required: false
        default: ''
        type: string

      wine_archs:
        description: 'Wine 目标架构'
        required: false
        default: 'arm64ec,aarch64,i386'
        type: string

      llvm_mingw_repo:
        description: '主 llvm-mingw 仓库'
        required: false
        default: 'mstorsjo/llvm-mingw'
        type: string

      llvm_mingw_date:
        description: 'llvm-mingw release tag'
        required: false
        default: '20251202'
        type: string

      llvm_mingw_name:
        description: 'llvm-mingw 资产名（留空自动）'
        required: false
        default: ''
        type: string

      enable_39bit_va:
        description: '启用 39-bit VA 适配'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      enable_noexec_fallback:
        description: '启用 noexec read() 兜底'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      build_fex:
        description: '同时编译 FEX (libarm64ecfex/libwow64fex)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

      fex_repo:
        description: 'FEX 仓库'
        required: false
        default: 'AndreRH/FEX'
        type: string

      fex_ref:
        description: 'FEX 分支'
        required: false
        default: 'arm64ec'
        type: string

      publish_release:
        description: '发布到 GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

  push:
    paths:
      - '.github/workflows/wine.yml'
      - 'ci/arm64/**'
      - 'patches/arm64/**'
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

env:
  BCC_ROOTFS_URL: https://github.com/as14725836/BCC/releases/download/wine-bcc-latest/wine-bcc.tar.xz
  TERMUX_GLIBC_PREFIX: /data/data/com.termux/files/usr/glibc
  TERMUX_PREFIX: /data/data/com.termux/files/usr
  OUT_DIR: /tmp/archlinux/tmp/wt-out

jobs:
  build-wine-arm64:

    runs-on: ubuntu-24.04

    timeout-minutes: 360

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download BCC Arch rootfs
        run: |
          set -e
          cd /tmp
          echo "📥 下载 BCC Arch rootfs ..."
          curl -L --retry 5 --retry-delay 10 -o wine-bcc.tar.xz "$BCC_ROOTFS_URL"
          ls -la wine-bcc.tar.xz
          sudo tar xf wine-bcc.tar.xz
          test -d /tmp/archlinux || { echo "❌ archlinux rootfs 未解出"; exit 1; }
          sudo mkdir -p "$OUT_DIR"
          echo "✅ rootfs ready"

      - name: Stage repo into chroot
        run: |
          set -e
          sudo mkdir -p /tmp/archlinux/tmp/wt-scripts
          sudo cp -r "$GITHUB_WORKSPACE"/* /tmp/archlinux/tmp/wt-scripts/ 2>/dev/null || true
          ls -la /tmp/archlinux/tmp/wt-scripts | head -40

      - name: Write build template into chroot
        run: |
          set -e
          sudo tee /tmp/archlinux/tmp/arm64-build.sh.tpl > /dev/null <<'ARMT'
          #!/bin/bash
          # Arch Linux chroot 内运行。构建 ARM64 (arm64ec/aarch64/i386) WOW64 Wine。
          set -e -o pipefail
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8
          export PKG_CONFIG_ALLOW_CROSS=1
          export DEBIAN_FRONTEND=noninteractive

          WINE_BRANCH="@@WINE_BRANCH@@"
          WINE_VERSION="@@WINE_VERSION@@"
          PROTON_BRANCH="@@PROTON_BRANCH@@"
          PROTON_COMMIT="@@PROTON_COMMIT@@"
          GN_BRANCH="@@GN_BRANCH@@"
          VALVE_REPO="@@VALVE_REPO@@"
          VALVE_BRANCH="@@VALVE_BRANCH@@"
          STAGING_VER="@@STAGING_VER@@"
          WINE_ARCHS="@@WINE_ARCHS@@"
          LLVM_REPO="@@LLVM_REPO@@"
          LLVM_DATE="@@LLVM_DATE@@"
          LLVM_NAME="@@LLVM_NAME@@"
          ENABLE_39BIT="@@39BIT@@"
          ENABLE_NOEXEC="@@NOEXEC@@"
          BUILD_FEX="@@BUILD_FEX@@"
          FEX_REPO="@@FEX_REPO@@"
          FEX_REF="@@FEX_REF@@"

          WS=/tmp/wt-scripts
          SRC=/opt/wine-src
          NATIVE=/opt/wine64-native
          PREFIX=/tmp/wine-install-wow64
          BUILD=/opt/wine-src/build-arm64
          LLVM_MINGW=/opt/llvm-mingw
          ARM64_SYSROOT=/opt/arm64-sysroot
          JOBS=$(nproc)

          echo "=============================================="
          echo " ARM64 WOW64 Wine build (Arch chroot)"
          echo "  branch=$WINE_BRANCH archs=$WINE_ARCHS"
          echo "  nproc=$JOBS"
          echo "=============================================="
          uname -m
          cat /etc/os-release | head -2 || true

          # ============================================================
          # 1. 安装 aarch64-linux 交叉工具链 + 构建依赖（pacman）
          # ============================================================
          echo "===== [1/9] 安装依赖（pacman）====="
          # 镜像选择：官方 mirrors.kernel.org 偶发超时，写入多个备选并开启并行下载
          if [ -f /etc/pacman.conf ]; then
            sed -i 's/^#ParallelDownloads.*/ParallelDownloads = 8/' /etc/pacman.conf 2>/dev/null || true
            grep -q '^ParallelDownloads' /etc/pacman.conf || echo 'ParallelDownloads = 8' >> /etc/pacman.conf
            sed -i 's/^#DisableDownloadTimeout/DisableDownloadTimeout/' /etc/pacman.conf 2>/dev/null || true
          fi
          mkdir -p /etc/pacman.d
          cat > /etc/pacman.d/mirrorlist <<'MIRREOF'
          Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
          Server = https://mirror.rackspace.com/archlinux/$repo/os/$arch
          Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
          MIRREOF

          pacman_install() {
            for attempt in 1 2 3 4; do
              echo "--- pacman 尝试 $attempt ---"
              if pacman -Syy --noconfirm --disable-download-timeout \
                   base-devel git curl xz zstd unzip file python perl pkgconf ccache \
                   autoconf automake libtool flex bison gettext nasm cmake ninja meson \
                   aarch64-linux-gnu-gcc aarch64-linux-gnu-binutils aarch64-linux-gnu-glibc \
                   mingw-w64-gcc mingw-w64-crt mingw-w64-headers mingw-w64-binutils; then
                return 0
              fi
              sleep $((attempt * 10))
            done
            return 1
          }
          if ! pacman_install; then
            echo "⚠️ 完整依赖安装失败，退化为最小集合再试"
            pacman -Syy --noconfirm --disable-download-timeout base-devel git curl xz zstd unzip \
              aarch64-linux-gnu-gcc aarch64-linux-gnu-glibc mingw-w64-gcc mingw-w64-crt mingw-w64-headers \
              || echo "⚠️ 最小集合也失败，继续（可能在后续步骤暴露）"
          fi

          echo "--- 工具链验证 ---"
          aarch64-linux-gnu-gcc --version | head -1 || true
          x86_64-w64-mingw32-gcc --version | head -1 || true
          gcc --version | head -1 || true
          ls -d /usr/aarch64-linux-gnu 2>/dev/null && echo "✅ aarch64 sysroot: /usr/aarch64-linux-gnu"

          # ============================================================
          # 2. 安装 llvm-mingw（提供 arm64ec-w64-mingw32-clang）
          # ============================================================
          echo "===== [2/9] 安装 llvm-mingw ====="
          if [ -z "$LLVM_NAME" ]; then
            LLVM_NAME="llvm-mingw-${LLVM_DATE}-ucrt-ubuntu-22.04-x86_64"
          fi
          LLVM_TAR="/tmp/${LLVM_NAME}.tar.xz"
          if [ ! -x "${LLVM_MINGW}/bin/arm64ec-w64-mingw32-clang" ]; then
            rm -rf "$LLVM_MINGW"; mkdir -p "$LLVM_MINGW"
            ok=0
            for url in \
              "https://github.com/${LLVM_REPO}/releases/download/${LLVM_DATE}/${LLVM_NAME}.tar.xz" \
              "https://github.com/bylaws/llvm-mingw/releases/download/${LLVM_DATE}/${LLVM_NAME}.tar.xz" ; do
              echo "尝试: $url"
              if curl -fL --retry 3 -o "$LLVM_TAR" "$url"; then ok=1; break; fi
            done
            [ "$ok" = "1" ] || { echo "❌ llvm-mingw 下载失败"; exit 1; }
            tar xf "$LLVM_TAR" -C "$LLVM_MINGW" --strip-components=1
            rm -f "$LLVM_TAR"
          fi
          export PATH="${LLVM_MINGW}/bin:$PATH"
          echo "${LLVM_MINGW}/lib" > /etc/ld.so.conf.d/llvm-mingw.conf
          ldconfig || true
          export LD_LIBRARY_PATH="${LLVM_MINGW}/lib:${LLVM_MINGW}/lib/clang/lib:${LD_LIBRARY_PATH:-}"
          echo "--- llvm-mingw 验证 ---"
          arm64ec-w64-mingw32-clang --version | head -1 || { echo "❌ arm64ec clang 缺失"; exit 1; }
          aarch64-w64-mingw32-clang --version | head -1 || true
          arm64ec-w64-mingw32-dlltool --version | head -1 || true

          # ============================================================
          # 3. 组装 aarch64-linux 交叉 sysroot
          #    Arch 只有 glibc 层的 aarch64 交叉（/usr/aarch64-linux-gnu）。
          #    X11/vulkan/pulse/freetype 等 arm64 运行库在 Arch 官方源没有，
          #    从 Debian arm64 的 .deb 里抽（用 ar + tar，无需 apt）。
          # ============================================================
          echo "===== [3/9] 组装 arm64 sysroot ====="
          mkdir -p "$ARM64_SYSROOT"
          if [ ! -f "${ARM64_SYSROOT}/.done" ]; then
            pacman -S --noconfirm --needed binutils libarchive bsdtar 2>/dev/null || true
            cd /tmp
            rm -rf arm64-debs && mkdir -p arm64-debs && cd arm64-debs
            MIRROR="http://deb.debian.org/debian"
            POOL="${MIRROR}/pool/main"
            # 关键 arm64 dev 包（名字 -> pool 路径子目录）
            # 直接用 packages.debian.org 的稳定路径：/debian/pool/main/<letter>/<pkg>/
            declare -A DEBPKG=(
              [libx11-dev]="libx/libx11"
              [libxext-dev]="libx/libxext"
              [libxi-dev]="libx/libxi"
              [libxcursor-dev]="libx/libxcursor"
              [libxrandr-dev]="libx/libxrandr"
              [libxfixes-dev]="libx/libxfixes"
              [libxcomposite-dev]="libx/libxcomposite"
              [libxdamage-dev]="libx/libxdamage"
              [libxxf86vm-dev]="libx/libxxf86vm"
              [libxrender-dev]="libx/libxrender"
              [libxinerama-dev]="libx/libxinerama"
              [libxshmfence-dev]="libx/libxshmfence"
              [libxkbcommon-dev]="libx/libxkbcommon"
              [libfreetype-dev]="f/freetype"
              [libfontconfig-dev]="f/fontconfig"
              [libexpat1-dev]="e/expat"
              [libpng-dev]="libp/libpng1.6"
              [libglib2.0-dev]="g/glib2.0"
              [libdbus-1-dev]="d/dbus"
              [libunwind-dev]="libu/libunwind"
              [libvulkan-dev]="v/vulkan-loader"
              [libwayland-dev]="w/wayland"
              [x11proto-dev]="x/xorgproto"
              [zlib1g-dev]="z/zlib"
              [libbz2-dev]="b/bzip2"
              [libbrotli-dev]="b/brotli"
              [libpulse-dev]="p/pulseaudio"
              [libasound2-dev]="a/alsa-lib"
              [libdrm-dev]="libd/libdrm"
              [libegl-dev]="libg/libglvnd"
              [libglvnd-dev]="libg/libglvnd"
              [libgl-dev]="libg/libglvnd"
              [libgles-dev]="libg/libglvnd"
              [libglx-dev]="libg/libglvnd"
              [libopengl-dev]="libo/libglvnd"
            )
            # 运行时库：-dev 包里的 libXXX.so 是指向 libXXX.so.N 的软链，
            # 而实体在 runtime 包里（未下载会出现断链 → 链接失败）。这里一并拉取。
            declare -A RUNPKG=(
              [libfreetype6]="f/freetype"
              [libfontconfig1]="f/fontconfig"
              [libpng16-16]="libp/libpng1.6"
              [libexpat1]="e/expat"
              [libglib2.0-0t64]="g/glib2.0"
              [libx11-6]="libx/libx11"
              [libxext6]="libx/libxext"
              [libxi6]="libx/libxi"
              [libxcursor1]="libx/libxcursor"
              [libxrandr2]="libx/libxrandr"
              [libxfixes3]="libx/libxfixes"
              [libxcomposite1]="libx/libxcomposite"
              [libxdamage1]="libx/libxdamage"
              [libxxf86vm1]="libx/libxxf86vm"
              [libxrender1]="libx/libxrender"
              [libxinerama1]="libx/libxinerama"
              [libxshmfence1]="libx/libxshmfence"
              [libxkbcommon0]="libx/libxkbcommon"
              [libvulkan1]="v/vulkan-loader"
              [libdbus-1-3]="d/dbus"
              [libunwind8]="libu/libunwind"
              [libwayland-client0]="w/wayland"
              [libwayland-server0]="w/wayland"
              [libwayland-cursor0]="w/wayland"
              [libwayland-egl1]="w/wayland"
              [libxcb1]="libx/libxcb"
              [libxau6]="libx/libxau"
              [libxdmcp6]="libx/libxdmcp"
              [libbsd0]="libb/libbsd"
              [libmd0]="libm/libmd"
              [libzstd1]="libz/libzstd"
              [libbrotli1]="b/brotli"
              [libgraphite2-3]="g/graphite2"
              [libharfbuzz0b]="h/harfbuzz"
              [libpcre2-8-0]="p/pcre2"
              [libffi8]="libf/libffi"
              [libuuid1]="u/util-linux"
              [libselinux1]="libs/libselinux"
              [libpcre2-16-0]="p/pcre2"
              [zlib1g]="z/zlib"
              [libbz2-1.0]="b/bzip2"
              [libbrotli1]="b/brotli"
              [libbrotli-dev]="b/brotli"
              [libharfbuzz0b]="h/harfbuzz"
              [libgraphite2-3]="g/graphite2"
              [libicu72]="i/icu"
              [libpng16-16]="libp/libpng1.6"
              [libjpeg62-turbo]="libj/libjpeg-turbo"
              [libbrotli1]="b/brotli"
              [libpulse0]="p/pulseaudio"
              [libpulse-mainloop-glib0]="p/pulseaudio"
              [libpulse-dev]="p/pulseaudio"
              [libasound2]="a/alsa-lib"
              [libasound2t64]="a/alsa-lib"
              [libdrm2]="libd/libdrm"
              [libdrm-amdgpu1]="libd/libdrm"
              [libdrm-intel1]="libd/libdrm"
              [libdrm-nouveau2]="libd/libdrm"
              [libdrm-radeon1]="libd/libdrm"
              [libegl1]="libg/libglvnd"
              [libgles2]="libg/libglvnd"
              [libglx0]="libg/libglvnd"
              [libgl1]="libg/libglvnd"
              [libglvnd0]="libg/libglvnd"
              [libopengl0]="libo/libglvnd"
              [libegl-mesa0]="m/mesa"
              [libgl1-mesa-dri]="m/mesa"
              [libasound2-data]="a/alsa-lib"
              [libasyncns0]="liba/libasyncns"
              [libsndfile1]="libs/libsndfile"
              [libflac12]="f/flac"
              [libvorbis0a]="libv/libvorbis"
              [libvorbisenc2]="libv/libvorbis"
              [libogg0]="libo/libogg"
              [libopus0]="o/opus"
              [libmpg123-0]="m/mpg123"
              [liblzma5]="x/xz-utils"
              [libsystemd0]="s/systemd"
              [libcap2]="libc/libcap2"
              [libgcrypt20]="libg/libgcrypt20"
              [libgpg-error0]="libg/libgpg-error"
              [libapparmor1]="a/apparmor"
              [libmp3lame0]="l/lame"
              [libid3tag0]="libi/libid3tag"
              [libx11-xcb1]="libx/libx11"
              [libflac12]="f/flac"
              [libogg0]="libo/libogg"
              [libvorbis0a]="libv/libvorbis"
              [libvorbisenc2]="libv/libvorbis"
              [libopus0]="o/opus"
              [libmpg123-0]="m/mpg123"
              [libgsm1]="libg/libgsm"
              [libspeex1]="s/speex"
              [libtwolame0]="t/twolame"
              [libwavpack1]="w/wavpack"
            )
            fetched=0
            for pkg in "${!DEBPKG[@]}"; do
              sub="${DEBPKG[$pkg]}"
              # 列 pool 目录，找 <pkg>_<ver>_arm64.deb
              idx="${MIRROR}/pool/main/${sub}/"
              deb=$(curl -s "$idx" | grep -oE "${pkg}_[0-9][^\"]*_(arm64|all)\.deb" | sort -V | tail -1 || true)
              if [ -z "$deb" ]; then
                echo "  ⚠️ 未找到 $pkg (arm64)"
                continue
              fi
              if curl -fsL -o "$deb" "${idx}${deb}"; then
                echo "  ✅ $deb"
                # 解包 .deb（ar 归档 → data.tar.*）
                ar x "$deb" 2>/dev/null || bsdtar xf "$deb" 2>/dev/null || true
                dataf=$(ls data.tar.* 2>/dev/null | head -1) || true
                if [ -n "$dataf" ]; then
                  tar xf "$dataf" -C "$ARM64_SYSROOT" --exclude='./usr/share/doc/*' \
                      --exclude='./usr/share/man/*' 2>/dev/null || true
                  rm -f "$dataf" debian-binary control.tar.* 2>/dev/null || true
                  fetched=$((fetched+1))
                fi
              fi
            done
            echo "ℹ️ 解出 $fetched 个 arm64 dev 包到 $ARM64_SYSROOT"
            # ---- 拉取 runtime 包，补全 .so.N 实体 ----
            for pkg in "${!RUNPKG[@]}"; do
              sub="${RUNPKG[$pkg]}"
              idx="${MIRROR}/pool/main/${sub}/"
              deb=$(curl -s "$idx" | grep -oE "${pkg}_[0-9][^\"]*_(arm64|all)\.deb" | grep -v 'dbgsym' | sort -V | tail -1 || true)
              if [ -z "$deb" ]; then echo "  ⚠️ runtime 未找到 $pkg"; continue; fi
              if curl -fsL -o "$deb" "${idx}${deb}"; then
                _td=$(mktemp -d)
                ( cd "$_td" && { ar x "$OLDPWD/$deb" 2>/dev/null || bsdtar xf "$OLDPWD/$deb" 2>/dev/null || true; } ) || true
                dataf=$(ls "$_td"/data.tar.* 2>/dev/null | head -1)
                if [ -n "$dataf" ]; then
                  tar xf "$dataf" -C "$ARM64_SYSROOT" --exclude='./usr/share/doc/*' \
                      --exclude='./usr/share/man/*' 2>/dev/null || true
                fi
                rm -rf "$_td" "$deb" 2>/dev/null || true
              fi
            done
            echo "ℹ️ runtime 包补齐完成"
            # 关键：把抽出的 arm64 头文件/库合并进 gcc 的默认 sysroot
            #        /usr/aarch64-linux-gnu，否则 aarch64-linux-gnu-gcc 看不到它们。
            ARCH_SYSROOT=/usr/aarch64-linux-gnu
            if [ -d "$ARCH_SYSROOT" ]; then
              mkdir -p "$ARCH_SYSROOT/include" "$ARCH_SYSROOT/lib"
              # Debian multiarch: usr/include -> include, usr/lib/aarch64-linux-gnu -> lib
              if [ -d "$ARM64_SYSROOT/usr/include" ]; then
                cp -a "$ARM64_SYSROOT/usr/include/." "$ARCH_SYSROOT/include/" 2>/dev/null || true
              fi
              # Debian 把 freetype 头放在 include/freetype2/，libpng 放在 libpng16/
              # 探测时 gcc 不会自动加这些子目录 → 直接补链接到 include 根
              for sub in freetype2 libpng16; do
                if [ -d "$ARCH_SYSROOT/include/$sub" ]; then
                  ( cd "$ARCH_SYSROOT/include/$sub" && \
                    for h in *.h; do [ -e "$h" ] && [ ! -e "../../$h" ] && ln -sf "$sub/$h" "../../$h" 2>/dev/null; done ) || true
                fi
              done
              ls -la "$ARCH_SYSROOT/include/ft2build.h" 2>&1 | head -2 || true
              if [ -d "$ARM64_SYSROOT/usr/lib/aarch64-linux-gnu" ]; then
                cp -a "$ARM64_SYSROOT/usr/lib/aarch64-linux-gnu/." "$ARCH_SYSROOT/lib/" 2>/dev/null || true
              fi
              # pulseaudio 把 libpulsecommon-XX.so 放在 lib/pulseaudio/ 子目录，
              # 链接器不会递归搜索子目录 → 平铺软链到 lib/ 顶层
              if [ -d "$ARCH_SYSROOT/lib/pulseaudio" ]; then
                ( cd "$ARCH_SYSROOT/lib/pulseaudio" && for f in *.so*; do
                    [ -e "$f" ] || continue
                    [ -e "$ARCH_SYSROOT/lib/$f" ] || ln -sf "pulseaudio/$f" "$ARCH_SYSROOT/lib/$f"
                  done ) || true
                echo "--- pulseaudio 平铺后 ---"
                ls -la "$ARCH_SYSROOT"/lib/libpulsecommon* 2>&1 | head -5 || true
              else
                echo "⚠️ 未发现 $ARCH_SYSROOT/lib/pulseaudio 目录"
              fi
              # libpulsecommon 依赖 libsndfile/flac/vorbis 等：同样平铺
              for sub in sndfile pulseaudio; do
                [ -d "$ARCH_SYSROOT/lib/$sub" ] || continue
                ( cd "$ARCH_SYSROOT/lib/$sub" && for f in *.so*; do
                    [ -e "$f" ] || continue
                    [ -e "$ARCH_SYSROOT/lib/$f" ] || ln -sf "$sub/$f" "$ARCH_SYSROOT/lib/$f"
                  done ) || true
              done
              # gcc 的默认库目录是 <sysroot>/lib64（不是 lib）→ 把 lib 内容同步过去
              mkdir -p "$ARCH_SYSROOT/lib64"
              cp -a "$ARCH_SYSROOT/lib/." "$ARCH_SYSROOT/lib64/" 2>/dev/null || true
              # pkgconfig 合并（gcc 的 sysroot 下）
              mkdir -p "$ARCH_SYSROOT/lib/pkgconfig" "$ARCH_SYSROOT/lib64/pkgconfig"
              if [ -d "$ARM64_SYSROOT/usr/lib/aarch64-linux-gnu/pkgconfig" ]; then
                cp -a "$ARM64_SYSROOT/usr/lib/aarch64-linux-gnu/pkgconfig/." "$ARCH_SYSROOT/lib/pkgconfig/" 2>/dev/null || true
              fi
              if [ -d "$ARM64_SYSROOT/usr/share/pkgconfig" ]; then
                cp -a "$ARM64_SYSROOT/usr/share/pkgconfig/." "$ARCH_SYSROOT/lib/pkgconfig/" 2>/dev/null || true
              fi
              cp -a "$ARCH_SYSROOT/lib/pkgconfig/." "$ARCH_SYSROOT/lib64/pkgconfig/" 2>/dev/null || true
              # Debian 的 .pc 里 includedir=/usr/include、libdir=/usr/lib/aarch64-linux-gnu，
              # 但真实合并位置是 $ARCH_SYSROOT/{include,lib}。逐条改写以匹配。
              for pc in "$ARCH_SYSROOT"/lib/pkgconfig/*.pc "$ARCH_SYSROOT"/lib64/pkgconfig/*.pc; do
                [ -f "$pc" ] || continue
                sed -i \
                  -e "s|^prefix=/usr$|prefix=$ARCH_SYSROOT|" \
                  -e "s|^exec_prefix=/usr$|exec_prefix=$ARCH_SYSROOT|" \
                  -e "s|^includedir=/usr/include$|includedir=$ARCH_SYSROOT/include|" \
                  -e "s|^includedir=\${prefix}/include$|includedir=$ARCH_SYSROOT/include|" \
                  -e "s|^libdir=/usr/lib/aarch64-linux-gnu$|libdir=$ARCH_SYSROOT/lib|" \
                  -e "s|^libdir=\${exec_prefix}/lib/aarch64-linux-gnu$|libdir=$ARCH_SYSROOT/lib|" \
                  "$pc" 2>/dev/null || true
              done
              echo "--- 改写后的 libpulse.pc ---"
              cat "$ARCH_SYSROOT/lib/pkgconfig/libpulse.pc" 2>/dev/null | head -12 || true
              echo "--- pkg-config libpulse 自检（交叉） ---"
              export PKG_CONFIG_PATH="$ARCH_SYSROOT/lib/pkgconfig:$ARCH_SYSROOT/lib64/pkgconfig"
              export PKG_CONFIG_LIBDIR="$ARCH_SYSROOT/lib/pkgconfig:$ARCH_SYSROOT/lib64/pkgconfig"
              pkg-config --exists libpulse && echo "✅ pkg-config --exists libpulse OK" || echo "❌ pkg-config --exists libpulse FAIL"
              pkg-config --cflags --libs libpulse 2>&1 | head -3 || true
              echo "--- 手工 pulse 编译自检 ---"
              cat > /tmp/pchk.c <<'PCEOF'
          #include <pulse/pulseaudio.h>
          #include <pulse/version.h>
          #if PA_API_VERSION < 12
          #error "pulse too old"
          #endif
          int main(void){ pa_mainloop *m = pa_mainloop_new(); pa_mainloop_free(m); return 0; }
          PCEOF
              if aarch64-linux-gnu-gcc $(pkg-config --cflags libpulse 2>/dev/null) /tmp/pchk.c -o /tmp/pchk $(pkg-config --libs libpulse 2>/dev/null) -Wl,--unresolved-symbols=ignore-in-shared-libs 2>/tmp/pchk.err; then
                echo "✅ pulse 编译自检 OK"
              else
                echo "❌ pulse 编译自检 失败"; head -25 /tmp/pchk.err || true
              fi
              echo "✅ 已合并到 $ARCH_SYSROOT"
              echo "--- sysroot 自检 ---"
              ls -la "$ARCH_SYSROOT"/lib/libX11.so* "$ARCH_SYSROOT"/lib/libfreetype.so* 2>&1 | head -12 || true
              printf '#include <X11/Xlib.h>\nint main(void){return (int)(long)XOpenDisplay(0);}\n' > /tmp/xchk.c
              if aarch64-linux-gnu-gcc /tmp/xchk.c -o /tmp/xchk -lX11 2>/tmp/xchk.err; then
                echo "✅ 链接自检: -lX11 OK"
              else
                echo "❌ 链接自检: -lX11 失败"; head -20 /tmp/xchk.err || true
              fi
              ls -la "$ARCH_SYSROOT/include/X11/Xlib.h" 2>&1 | head -2 || true
              # freetype 链接自检
              cat > /tmp/ftchk.c <<'FTEOF'
          #include <ft2build.h>
          #include FT_FREETYPE_H
          int main(void){ FT_Library l; return FT_Init_FreeType(&l); }
          FTEOF
              if aarch64-linux-gnu-gcc -I"$ARCH_SYSROOT/include/freetype2" /tmp/ftchk.c -o /tmp/ftchk -lfreetype 2>/tmp/ftchk.err; then
                echo "✅ 链接自检: -lfreetype OK"
              else
                echo "❌ 链接自检: -lfreetype 失败"; head -30 /tmp/ftchk.err || true
              fi
              ls -la "$ARCH_SYSROOT"/lib64/libfreetype.so* "$ARCH_SYSROOT"/lib/libfontconfig.so* 2>&1 | head -6 || true
              echo "--- pulse 相关 ---"
              ls -la "$ARCH_SYSROOT"/lib/libpulse.so* "$ARCH_SYSROOT"/include/pulse/pulseaudio.h 2>&1 | head -8 || true
              ls "$ARCH_SYSROOT"/lib/pkgconfig/libpulse*.pc 2>&1 | head -5 || true
              if [ -f "$ARCH_SYSROOT/lib/pkgconfig/libpulse.pc" ]; then
                echo "--- libpulse.pc ---"; cat "$ARCH_SYSROOT/lib/pkgconfig/libpulse.pc"
              fi
            fi
            touch "${ARM64_SYSROOT}/.done"
            cd /tmp
          else
            echo "✅ arm64 sysroot 已存在（缓存）"
          fi
          ls -la "$ARM64_SYSROOT/usr/lib/aarch64-linux-gnu" 2>/dev/null | head -10 || \
            echo "ℹ️ $ARM64_SYSROOT 结构（best effort）"
          find "$ARM64_SYSROOT" -maxdepth 4 -name 'libX11*' 2>/dev/null | head -3 || true

          echo "✅ 阶段 1-3 完成"

          # ============================================================
          # 4. 获取 Wine 源码
          # ============================================================
          echo "===== [4/9] 获取 Wine 源码 ($WINE_BRANCH) ====="
          rm -rf "$SRC"
          mkdir -p "$SRC"
          cd "$SRC"

          case "$WINE_BRANCH" in
            proton)
              git clone --branch "$PROTON_BRANCH" --single-branch \
                https://github.com/WinNative-Emu/proton-wine.git source
              cd source
              [ -n "$PROTON_COMMIT" ] && git checkout "$PROTON_COMMIT" || true
              ;;
            staging)
              git clone --depth=1 https://github.com/wine-staging/wine-staging.git staging-src
              UP=$(cat staging-src/staging/upstream-commit 2>/dev/null || echo master)
              git clone https://github.com/wine-mirror/wine.git source
              cd source
              git checkout "$UP" 2>/dev/null || true
              cd "$SRC"
              python3 staging-src/staging/patchinstall.py DESTDIR="$SRC/source" --all --no-autoconf || true
              ;;
            winearm64ec)
              git clone --branch w641010 https://github.com/hostei33/wine-tkg.git source
              cd source
              [ "$WINE_VERSION" != "latest" ] && git checkout "wine-$WINE_VERSION" 2>/dev/null || true
              ;;
            pipetto-proton9-arm64ec)
              git clone --branch proton-9.0-arm64ec https://github.com/Pipetto-crypto/wine.git source
              cd source
              ;;
            proton-10.34-GE)
              git clone --branch proton_10.34-GE https://github.com/The412Banner/proton-wine.git source
              cd source
              ;;
            proton-gamenative)
              git clone --branch "$GN_BRANCH" https://github.com/GameNative/proton-wine.git source
              cd source
              ;;
            valve-wine)
              git clone --branch "$VALVE_BRANCH" "$VALVE_REPO" source
              cd source
              ;;
            valve-proton)
              git clone --branch "$VALVE_BRANCH" https://github.com/ValveSoftware/Proton.git proton-repo
              cd proton-repo
              git submodule update --init --depth 1 wine || true
              mv wine "$SRC/source"
              cd "$SRC/source"
              ;;
            *)
              echo "❌ 未知 wine_branch: $WINE_BRANCH"; exit 1 ;;
          esac

          cd "$SRC/source"
          git submodule update --init --recursive --depth 1 2>/dev/null || true

          # ---- 版本净化 ----
          if [ -f VERSION ]; then
            VER_SAFE=$(sed -n '1s/^Wine version //p' VERSION | tr ' ' '-' | tr -cd 'A-Za-z0-9._-')
          fi
          [ -n "$VER_SAFE" ] || VER_SAFE=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^wine-//' | tr -cd 'A-Za-z0-9._-')
          [ -n "$VER_SAFE" ] || VER_SAFE="$WINE_VERSION"
          WINE_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo nogit)
          BUILD_NAME="wine-${VER_SAFE}-${WINE_COMMIT}-${WINE_BRANCH}-arm64ce-wow64"
          echo "BUILD_NAME=$BUILD_NAME"

          # ============================================================
          # 5. 应用补丁
          # ============================================================
          echo "===== [5/9] 应用补丁 ====="
          # 5.1 adapted-11.18 补丁（quartz colour / qasf asf / termux-dns）
          for p in 0060-quartz-implement-colour-filter.patch 0061-qasf-deliver-compressed-asf-streams.patch termux-dns-fix.patch; do
            if [ -f "$WS/$p" ]; then
              echo "--- $p ---"
              patch -p1 --forward --dry-run < "$WS/$p" >/dev/null 2>&1 && \
                patch -p1 --forward < "$WS/$p" || echo "  跳过（不适用/已应用）"
            fi
          done

          # 5.2 Termux 环境适配脚本
          if [ -f "$WS/patches/termux-env/termux_env_tweaks.py" ]; then
            python3 "$WS/patches/termux-env/termux_env_tweaks.py" "$PWD" || echo "⚠️ termux_env_tweaks 跳过"
          fi

          # 5.3 wow64 completion patches
          if [ -f "$WS/patches/wow64/wow64-completion.py" ]; then
            python3 "$WS/patches/wow64/wow64-completion.py" "$PWD" || echo "⚠️ wow64-completion 跳过"
          fi

          # 5.4 cs-timeout-guard
          if [ -f "$WS/patches/sync/cs-timeout-guard.py" ]; then
            python3 "$WS/patches/sync/cs-timeout-guard.py" "$PWD" || echo "⚠️ cs-timeout-guard 跳过"
          fi

          # 5.5 esync 头文件兜底（保守：仅当确有 fsync.h 且缺 esync.h 时前插一行）
          for f in server/request.c server/main.c; do
            if [ -f "$f" ] && ! grep -q '#include "esync.h"' "$f" && grep -q '#include "fsync.h"' "$f"; then
              sed -i 's|#include "fsync.h"|#include "esync.h"\n#include "fsync.h"|' "$f" 2>/dev/null || true
            fi
          done

          # 5.8 39-bit VA / noexec 适配（可选）
          if [ "$ENABLE_39BIT" = "true" ] && [ -f "$WS/wine-virtual-memory-39bit-hiarea.patch" ]; then
            echo "--- 39-bit VA 适配 ---"
            patch -p1 --forward --dry-run < "$WS/wine-virtual-memory-39bit-hiarea.patch" >/dev/null 2>&1 && \
              patch -p1 --forward < "$WS/wine-virtual-memory-39bit-hiarea.patch" || echo "  跳过（版本不匹配）"
          fi
          if [ "$ENABLE_NOEXEC" = "true" ] && [ -f "$WS/wine-box64-noexec.patch" ]; then
            echo "--- noexec 兜底 ---"
            patch -p1 --forward --dry-run < "$WS/wine-box64-noexec.patch" >/dev/null 2>&1 && \
              patch -p1 --forward < "$WS/wine-box64-noexec.patch" || echo "  跳过（版本不匹配）"
          fi
          if [ -f "$WS/wine-box64-compat.patch" ]; then
            patch -p1 --forward < "$WS/wine-box64-compat.patch" || echo "  box64-compat 跳过"
          fi

          # 5.8 proton-wine 源码修补：server.c 调用 esync_init() 但未 include esync.h
          #     （proton_11.0 分支缺陷，上游靠间接 include；交叉编译下暴露）
          if [ -f dlls/ntdll/unix/server.c ]; then
            if grep -q 'esync_init' dlls/ntdll/unix/server.c && \
               ! grep -q '#include "esync.h"' dlls/ntdll/unix/server.c; then
              echo "--- 修补 ntdll/unix/server.c: 补 esync.h include ---"
              sed -i 's|#include "fsync.h"|#include "fsync.h"\n#include "esync.h"|' dlls/ntdll/unix/server.c || true
              grep -n 'include "esync.h"\|include "fsync.h"' dlls/ntdll/unix/server.c | head -3 || true
            fi
          fi
          # fsync.c/esync.c 若 do_esync/do_fsync 缺失符号，同样补 include
          for f in dlls/ntdll/unix/esync.c dlls/ntdll/unix/fsync.c; do
            [ -f "$f" ] || continue
            :
          done

          # 5.8b C23 `bool` 关键字兼容（Pipetto/wine proton-9.0-arm64ec 等旧分支）
          #      旧代码: `struct sysparam_bool_entry bool;` 与 `{ .bool = {...} }`
          #      C23 下 bool 是关键字 -> "expected identifier before 'bool'"
          if [ -f dlls/win32u/sysparams.c ]; then
            if grep -qE 'struct[[:space:]]+sysparam_bool_entry[[:space:]]+bool[[:space:]]*;' dlls/win32u/sysparams.c; then
              echo "--- C23 bool 关键字兼容: sysparams.c (bool -> boolean) ---"
              sed -i -E 's/(struct[[:space:]]+sysparam_bool_entry[[:space:]]+)bool([[:space:]]*;)/\1boolean\2/g' dlls/win32u/sysparams.c
              sed -i -E 's/\.bool([[:space:]]*=)/.boolean\1/g' dlls/win32u/sysparams.c
              grep -nE 'sysparam_bool_entry[[:space:]]+boolean|\.boolean[[:space:]]*=' dlls/win32u/sysparams.c | head -8 || true
            fi
          fi
          # 5.8c 其它把 bool 当成员名的文件（仅报告，不自动改以免误伤）
          BOOL_HITS=$(grep -rlE '(struct|union)[[:space:]]+[A-Za-z_][A-Za-z_0-9]*[[:space:]]+bool[[:space:]]*(;|,)' dlls/ 2>/dev/null | head -20 || true)
          if [ -n "$BOOL_HITS" ]; then
            echo "以下文件把 bool 用作成员名（C23 下会报错），若再次失败请一并处理:"
            echo "$BOOL_HITS"
          fi

          # 5.9 清理补丁残留（不因 .rej 中止，但打印出来）
          if find . -name '*.rej' | grep -q .; then
            echo "⚠️ 存在未应用的补丁片段（已清理，不影响构建）:"
            find . -name '*.rej'
            find . -name '*.rej' -delete
          fi
          # 清理因失败补丁产生的 .orig
          find . -name '*.orig' -delete 2>/dev/null || true

          # ============================================================
          # 6. Regenerate configure
          # ============================================================
          echo "===== [6/9] autoreconf ====="
          if [ -x ./autogen.sh ]; then
            echo "--- 使用项目自带 autogen.sh ---"
            NOCONFIGURE=1 ./autogen.sh || true
          fi
          if [ ! -x ./configure ] && [ -f configure.ac ]; then
            echo "--- autoreconf -fiv ---"
            autoreconf -fiv || true
          fi
          if [ ! -x ./configure ]; then
            echo "❌ configure 未生成，尝试从 configure.ac 诊断"
            ls -la autogen.sh configure configure.ac 2>&1 || true
            exit 1
          fi
          echo "✅ configure 就位"
          bash configure --help >/dev/null 2>&1 || true

          # ============================================================
          # 7. native Wine tools (x86_64 host) + NLS
          # ============================================================
          echo "===== [7/9] native tools + NLS ====="
          rm -rf "$NATIVE"; mkdir -p "$NATIVE"
          NATIVE_BUILD=/opt/wine-native-build
          rm -rf "$NATIVE_BUILD"; mkdir -p "$NATIVE_BUILD"
          cd "$NATIVE_BUILD"
          export CC=gcc CXX=g++
          "$SRC/source/configure" \
            --enable-win64 --disable-tests --without-x --without-vulkan --without-wayland \
            --without-pulse --without-alsa --without-dbus --without-udev --without-cups \
            --without-gphoto --without-gssapi --without-krb5 --without-pcap --without-pcsclite \
            --without-sane --without-usb --without-v4l2 --without-ffmpeg --without-gstreamer \
            || { echo "❌ native configure 失败"; exit 1; }
          make __tooldeps__ -j"$JOBS"
          make -C nls -j"$JOBS"
          NLS_BACKUP=/opt/nls-backup
          rm -rf "$NLS_BACKUP"; mkdir -p "$NLS_BACKUP"
          cp -a nls/*.nls "$NLS_BACKUP/" 2>/dev/null || true
          test -f "$NATIVE_BUILD/tools/winebuild/winebuild" && echo "✅ winebuild ok"
          ls -la "$NLS_BACKUP" | head || true

          echo "✅ 阶段 4-7 完成"

          # ============================================================
          # 8. Configure + build ARM64 WOW64
          # ============================================================
          echo "===== [8/9] configure ARM64 ($WINE_ARCHS) ====="
          rm -rf "$BUILD"; mkdir -p "$BUILD"
          cd "$BUILD"
          export PATH="${LLVM_MINGW}/bin:$PATH"
          export LD_LIBRARY_PATH="${LLVM_MINGW}/lib:${LLVM_MINGW}/lib/clang/lib:${LD_LIBRARY_PATH:-}"

          export CC="aarch64-linux-gnu-gcc"
          export CXX="aarch64-linux-gnu-g++"
          export CROSSCC="arm64ec-w64-mingw32-clang"
          export CROSSCXX="arm64ec-w64-mingw32-clang++"

          # arm64ec 缓存变量：跳过编译期探测（交叉无法运行）
          export ac_cv_arm64ec_crosscc=yes
          # freetype/fontconfig 交叉链接缓存（依赖链复杂，直接声明可用）
          export ac_cv_lib_freetype_FT_Init_FreeType=yes
          export ac_cv_lib_fontconfig_FcInit=yes
          export ac_cv_lib_pulse_pa_mainloop_new=yes
          export ac_cv_lib_pulse_pa_stream_connect_playback=yes
          export ac_cv_header_pulse_pulseaudio_h=yes
          export ac_cv_header_pulse_version_h=yes
          export ac_cv_header_ft2build_h=yes
          export ac_cv_header_fontconfig_fontconfig_h=yes
          export FREETYPE_CFLAGS="-I/usr/aarch64-linux-gnu/include/freetype2"
          export FONTCONFIG_CFLAGS="-I/usr/aarch64-linux-gnu/include"
          export FONTCONFIG_LIBS="-lfontconfig"
          # EGL/GL/drm soname 交叉缓存（proton win32u/opengl.c 需要 SONAME_LIBEGL）
          export ac_cv_lib_soname_EGL=libEGL.so.1
          export ac_cv_lib_soname_GL=libGL.so.1
          export ac_cv_lib_soname_GLX=libGLX.so.0
          export ac_cv_lib_soname_OpenGL=libOpenGL.so.0
          export ac_cv_lib_soname_drm=libdrm.so.2
          export ac_cv_lib_EGL_eglGetProcAddress=yes
          export ac_cv_lib_drm_drmGetVersion=yes
          export ac_cv_header_EGL_egl_h=yes
          export ac_cv_header_EGL_eglext_h=yes
          export ac_cv_header_GL_gl_h=yes
          export ac_cv_header_xf86drm_h=yes

          export ac_cv_arm64ec_cflags__target_arm64ec_windows__fuse_ld_lld__Wl__subsystem_console__Wl__WX=yes
          export ac_cv_arm64ec_cflags__target_arm64ec_windows__fuse_ld_lld__Wl__no_default_config=yes

          # arm64 sysroot（best-effort；找不到就 --without-x 等）
          ARM64_LIBDIR="/usr/aarch64-linux-gnu/lib"
          if [ -f "$ARM64_LIBDIR/libX11.so" ]; then
            export PKG_CONFIG_PATH="${ARM64_LIBDIR}/pkgconfig:${ARM64_LIBDIR}/pkgconfig/../pkgconfig:/usr/aarch64-linux-gnu/lib/pkgconfig:/usr/aarch64-linux-gnu/lib64/pkgconfig"
            export PKG_CONFIG_LIBDIR="/usr/aarch64-linux-gnu/lib/pkgconfig:/usr/aarch64-linux-gnu/lib64/pkgconfig"
            # 交叉时 autoconf 会找 ${ac_tool_prefix}pkg-config，Arch 无此前缀工具 → 显式指定
            export PKG_CONFIG="pkg-config"
            export PKG_CONFIG_FOR_BUILD="pkg-config"
            export PULSE_CFLAGS="-I/usr/aarch64-linux-gnu/include -D_REENTRANT"
            export PULSE_LIBS="-L/usr/aarch64-linux-gnu/lib -lpulse"
            unset PKG_CONFIG_SYSROOT_DIR
            XFLAGS="--with-x"
            VKFLAGS="--with-vulkan"
            echo "✅ 使用 merged arm64 sysroot: $ARM64_LIBDIR"
            ls "$ARM64_LIBDIR"/libX11.so "$ARM64_LIBDIR"/libvulkan.so 2>&1 | head -3 || true
          else
            export PKG_CONFIG_PATH="/usr/lib/pkgconfig:/usr/share/pkgconfig"
            export PKG_CONFIG_LIBDIR="/usr/lib/pkgconfig:/usr/share/pkgconfig"
            XFLAGS="--without-x"
            VKFLAGS="--without-vulkan"
            echo "ℹ️ 无 arm64 sysroot → $XFLAGS $VKFLAGS"
          fi

          export CFLAGS="-O2 -pipe -I/usr/aarch64-linux-gnu/include/freetype2 -I/usr/aarch64-linux-gnu/include/libpng16"
          # 交叉链接 freetype 需要显式带上它的依赖链
          export LDFLAGS="-L/usr/aarch64-linux-gnu/lib -Wl,-rpath-link,/usr/aarch64-linux-gnu/lib -Wl,-rpath-link,/usr/aarch64-linux-gnu/lib/pulseaudio -Wl,-rpath-link,/usr/aarch64-linux-gnu/lib64"
          export CXXFLAGS="$CFLAGS"
          export CROSSCFLAGS="-O2 -pipe"
          export CROSSCXXFLAGS="-O2 -pipe"
          export LDFLAGS="$LDFLAGS -Wl,-O1 -Wl,--as-needed -Wl,--unresolved-symbols=ignore-in-shared-libs"

          set -x
          "$SRC/source/configure" \
            --enable-win64 \
            --host=aarch64-linux-gnu \
            --with-mingw=clang \
            --enable-archs="$WINE_ARCHS" \
            --with-wine-tools="$NATIVE_BUILD" \
            --prefix="$PREFIX" \
            --disable-win16 --disable-opencl --disable-tests --disable-winemenubuilder \
            --enable-nls --with-pthread --without-ffmpeg \
            $XFLAGS $VKFLAGS \
            --with-pulse --without-oss --with-alsa --without-cups --without-gphoto \
            --without-gssapi --without-krb5 --without-pcap --without-pcsclite \
            --without-sane --without-usb --without-v4l2 --without-dbus --without-udev \
            --without-gstreamer \
            2>&1 | tail -120 || { echo "❌ configure 失败"; tail -60 config.log; exit 1; }
          set +x

          test -f config.status || { echo "❌ 无 config.status"; tail -80 config.log; exit 1; }
          echo "===== configure summary ====="
          grep -E '^  (Architecture|Wine version|Host CPU|Cross|NLS|X11|Vulkan)' config.log 2>/dev/null | head -20 || true

          echo "===== make -j$JOBS ====="
          set +e
          make -j"$JOBS" 2>&1 | tee /tmp/wine-arm64-build.log > /dev/null
          MAKE_RC=${PIPESTATUS[0]}
          set -e
          tail -80 /tmp/wine-arm64-build.log || true
          if [ "$MAKE_RC" -ne 0 ]; then
            echo "❌ make 失败 (RC=$MAKE_RC)"
            grep -nE '\[.*\] Error|error:|Error [0-9]+' /tmp/wine-arm64-build.log | tail -40 || true
            exit "$MAKE_RC"
          fi
          echo "✅ make 成功"
          echo "===== make install ====="
          make install > /tmp/wine-arm64-install.log 2>&1 || {
            echo "❌ make install 失败"; tail -50 /tmp/wine-arm64-install.log; exit 1; }
          tail -15 /tmp/wine-arm64-install.log || true

          # ---- NLS 兜底 ----
          if [ -d "$NLS_BACKUP" ]; then
            for d in "$PREFIX"/share/wine/nls "$PREFIX"/lib/wine/nls; do
              mkdir -p "$d" 2>/dev/null || true
              cp -a "$NLS_BACKUP"/*.nls "$d/" 2>/dev/null || true
            done
          fi

          # ============================================================
          # 8b. FEX 模拟器 DLL（可选）
          # ============================================================
          if [ "$BUILD_FEX" = "true" ]; then
            echo "===== [8b] 编译 FEX ====="
            FEX_SRC=/opt/fex-src
            rm -rf "$FEX_SRC"
            git clone --depth=1 --branch "$FEX_REF" --recurse-submodules --shallow-submodules \
              "https://github.com/${FEX_REPO}.git" "$FEX_SRC" || {
              echo "⚠️ FEX clone 失败，跳过"; BUILD_FEX=false; }
          fi
          if [ "$BUILD_FEX" = "true" ]; then
            export PATH="${LLVM_MINGW}/bin:$PATH"
            # FEX 是 mingw 交叉目标，必须清掉为 host(arm64 linux) 交叉注入的
            # LDFLAGS/CFLAGS/CXXFLAGS（-rpath-link、--unresolved-symbols 等会污染 lld）
            FEX_SAVE_LDFLAGS="${LDFLAGS-}"; FEX_SAVE_CFLAGS="${CFLAGS-}"; FEX_SAVE_CXXFLAGS="${CXXFLAGS-}"
            unset LDFLAGS CFLAGS CXXFLAGS LIBS CPPFLAGS
            export LDFLAGS="" CFLAGS="" CXXFLAGS=""
            cd "$FEX_SRC"
            mkdir -p build_ec build_pe
            # x86_64 模拟 → libarm64ecfex.dll
            cd build_ec
            cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False \
              -DTUNE_ARCH=generic -DTUNE_CPU=none \
              -DMINGW_TRIPLE=arm64ec-w64-mingw32 \
              -DBUILD_TESTS=OFF -DBUILD_TESTING=OFF \
              -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
              -DCMAKE_EXE_LINKER_FLAGS="" -DCMAKE_SHARED_LINKER_FLAGS="" -DCMAKE_MODULE_LINKER_FLAGS="" \
              .. > /tmp/fex-ec-cmake.log 2>&1 || { echo "⚠️ FEX ec cmake 失败"; tail -30 /tmp/fex-ec-cmake.log; }
            make -j"$JOBS" arm64ecfex > /tmp/fex-ec-make.log 2>&1 || { echo "⚠️ FEX ec make 失败"; tail -30 /tmp/fex-ec-make.log; }
            ARM64EC_DLL=$(find "$FEX_SRC" -name 'libarm64ecfex.dll' 2>/dev/null | head -1) || true
            # i386 模拟 → libwow64fex.dll
            cd "$FEX_SRC/build_pe"
            cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE=../Data/CMake/toolchain_mingw.cmake \
              -DENABLE_LTO=False -DENABLE_ASSERTIONS=False \
              -DTUNE_ARCH=generic -DTUNE_CPU=none \
              -DMINGW_TRIPLE=aarch64-w64-mingw32 \
              -DBUILD_TESTS=OFF -DBUILD_TESTING=OFF \
              -DCMAKE_DISABLE_FIND_PACKAGE_fmt=TRUE \
              -DCMAKE_EXE_LINKER_FLAGS="" -DCMAKE_SHARED_LINKER_FLAGS="" -DCMAKE_MODULE_LINKER_FLAGS="" \
              .. > /tmp/fex-pe-cmake.log 2>&1 || { echo "⚠️ FEX pe cmake 失败"; tail -30 /tmp/fex-pe-cmake.log; }
            make -j"$JOBS" wow64fex > /tmp/fex-pe-make.log 2>&1 || { echo "⚠️ FEX pe make 失败"; tail -30 /tmp/fex-pe-make.log; }
            WOW64_DLL=$(find "$FEX_SRC" -name 'libwow64fex.dll' 2>/dev/null | head -1) || true
            echo "ARM64EC_DLL=$ARM64EC_DLL"
            echo "WOW64_DLL=$WOW64_DLL"
            export LDFLAGS="$FEX_SAVE_LDFLAGS" CFLAGS="$FEX_SAVE_CFLAGS" CXXFLAGS="$FEX_SAVE_CXXFLAGS"
            if [ -n "$ARM64EC_DLL" ] || [ -n "$WOW64_DLL" ]; then
              DEST="$PREFIX/lib/wine/aarch64-windows"
              mkdir -p "$DEST" "$PREFIX/share/fex-emu/HostThunks" "$PREFIX/share/fex-emu/GuestThunks" "$PREFIX/share/fex-emu/RootFS"
              [ -n "$ARM64EC_DLL" ] && cp -f "$ARM64EC_DLL" "$DEST/"
              [ -n "$WOW64_DLL" ] && cp -f "$WOW64_DLL" "$DEST/"
              for t in "$FEX_SRC"/Data/*/Thunks/*; do [ -e "$t" ] && cp -a "$t" "$PREFIX/share/fex-emu/HostThunks/" 2>/dev/null || true; done
              cat > "$PREFIX/share/fex-emu/fex-env.sh" <<'FEXENV'
          # FEX 运行环境（source 本文件）
          export FEX_THUNKHOSTLIBS="${FEX_ROOT:-$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")}/HostThunks"
          export FEX_THUNKGUESTLIBS="${FEX_ROOT:-$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")}/GuestThunks"
          export FEX_ROOTFS="${FEX_ROOT:-$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")}/RootFS"
          export FEX_THUNKCONFIG="${FEX_ROOT:-$(dirname "$(readlink -f "${BASH_SOURCE[0]}")")}/ThunkConfig.json"
          export FEX_PORTABLE=1
          export HODLL64=libarm64ecfex.dll
          export HODLL=libwow64fex.dll
          FEXENV
              chmod 0755 "$PREFIX/share/fex-emu/fex-env.sh"
              echo "✅ FEX DLL 已安装到 $DEST"
              ls -la "$DEST"
            else
              echo "⚠️ 未产出 FEX DLL，跳过安装"
            fi
          fi

          echo "✅ 阶段 8 完成"

          # ============================================================
          # 9. 瘦身 + 打包
          # ============================================================
          echo "===== [9/9] 打包 ====="
          find "$PREFIX" -type f \( -name '*.a' -o -name '*.la' \) -delete 2>/dev/null || true
          find "$PREFIX" -type f \( -name '*.debug' -o -name '*.dwo' \) -delete 2>/dev/null || true
          rm -rf "$PREFIX/include" "$PREFIX/share/man" "$PREFIX/share/doc" 2>/dev/null || true

          # Termux runtime path（可选；仅当目标为 termux）
          if [ -d "$PREFIX/bin" ]; then
            for b in "$PREFIX"/bin/wine*; do
              [ -f "$b" ] || continue
              case "$(file -b "$b" 2>/dev/null)" in
                *ELF*aarch64*) : ;;
                *) continue ;;
              esac
            done || true
          fi

          rm -rf /tmp/pkg
          mkdir -p "/tmp/pkg/${BUILD_NAME}"
          cp -a "$PREFIX/." "/tmp/pkg/${BUILD_NAME}/"
          {
            echo "build_name     : $BUILD_NAME"
            echo "wine_branch    : $WINE_BRANCH"
            echo "archs          : $WINE_ARCHS"
            echo "host           : $(uname -m)"
            echo "cc (unix)      : $(aarch64-linux-gnu-gcc --version | head -1)" || true
            echo "cc (pe)        : $(arm64ec-w64-mingw32-clang --version | head -1)" || true
            echo "wine_commit    : $WINE_COMMIT"
            echo "39bit va       : $ENABLE_39BIT"
            echo "noexec fallback: $ENABLE_NOEXEC"
            echo "fex built      : $BUILD_FEX"
            echo "built at (UTC) : $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "/tmp/pkg/${BUILD_NAME}/BUILD_INFO.txt"

          cd /tmp/pkg
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -cJf "/tmp/${BUILD_NAME}.tar.xz" "${BUILD_NAME}"
          sha256sum "/tmp/${BUILD_NAME}.tar.xz" > /tmp/checksums.txt
          echo "$BUILD_NAME" > /tmp/BUILD_NAME.txt

          mkdir -p /tmp/wt-out
          cp -f "/tmp/${BUILD_NAME}.tar.xz" /tmp/wt-out/
          cp -f /tmp/checksums.txt /tmp/wt-out/
          cp -f /tmp/BUILD_NAME.txt /tmp/wt-out/

          echo "=============================================="
          echo " ✅ 构建完成: $BUILD_NAME"
          ls -la "/tmp/${BUILD_NAME}.tar.xz"
          echo "=============================================="


          ARMT
          sudo cp -f /tmp/archlinux/tmp/arm64-build.sh.tpl /tmp/arm64-build.sh.tpl
          sudo chown "$(id -u):$(id -g)" /tmp/arm64-build.sh.tpl
          echo "✅ template 就位: $(wc -l < /tmp/arm64-build.sh.tpl) lines"

      - name: Write build script
        env:
          IN_WINE_BRANCH: ${{ inputs.wine_branch || 'proton' }}
          IN_WINE_VERSION: ${{ inputs.wine_version || 'latest' }}
          IN_PROTON_BRANCH: ${{ inputs.proton_branch || 'proton_11.0' }}
          IN_PROTON_COMMIT: ${{ inputs.proton_commit || '' }}
          IN_GN_BRANCH: ${{ inputs.gamenative_branch || 'proton_11.0-2' }}
          IN_VALVE_REPO: ${{ inputs.valve_repo || 'https://github.com/ValveSoftware/wine.git' }}
          IN_VALVE_BRANCH: ${{ inputs.valve_branch || 'experimental_10.0' }}
          IN_STAGING_VER: ${{ inputs.staging_version || '' }}
          IN_WINE_ARCHS: ${{ inputs.wine_archs || 'arm64ec,aarch64,i386' }}
          IN_LLVM_REPO: ${{ inputs.llvm_mingw_repo || 'mstorsjo/llvm-mingw' }}
          IN_LLVM_DATE: ${{ inputs.llvm_mingw_date || '20251202' }}
          IN_LLVM_NAME: ${{ inputs.llvm_mingw_name || '' }}
          IN_39BIT: ${{ inputs.enable_39bit_va || 'true' }}
          IN_NOEXEC: ${{ inputs.enable_noexec_fallback || 'true' }}
          IN_BUILD_FEX: ${{ inputs.build_fex || 'true' }}
          IN_FEX_REPO: ${{ inputs.fex_repo || 'AndreRH/FEX' }}
          IN_FEX_REF: ${{ inputs.fex_ref || 'arm64ec' }}
        run: |
          set -e
          python3 - "$GITHUB_WORKSPACE" <<'PYGEN'
          import os, sys, textwrap
          ws = sys.argv[1]
          m = {
              "@@WINE_BRANCH@@": os.environ["IN_WINE_BRANCH"],
              "@@WINE_VERSION@@": os.environ["IN_WINE_VERSION"],
              "@@PROTON_BRANCH@@": os.environ["IN_PROTON_BRANCH"],
              "@@PROTON_COMMIT@@": os.environ["IN_PROTON_COMMIT"],
              "@@GN_BRANCH@@": os.environ["IN_GN_BRANCH"],
              "@@VALVE_REPO@@": os.environ["IN_VALVE_REPO"],
              "@@VALVE_BRANCH@@": os.environ["IN_VALVE_BRANCH"],
              "@@STAGING_VER@@": os.environ["IN_STAGING_VER"],
              "@@WINE_ARCHS@@": os.environ["IN_WINE_ARCHS"],
              "@@LLVM_REPO@@": os.environ["IN_LLVM_REPO"],
              "@@LLVM_DATE@@": os.environ["IN_LLVM_DATE"],
              "@@LLVM_NAME@@": os.environ["IN_LLVM_NAME"],
              "@@39BIT@@": os.environ["IN_39BIT"],
              "@@NOEXEC@@": os.environ["IN_NOEXEC"],
              "@@BUILD_FEX@@": os.environ["IN_BUILD_FEX"],
              "@@FEX_REPO@@": os.environ["IN_FEX_REPO"],
              "@@FEX_REF@@": os.environ["IN_FEX_REF"],
          }
          tpl = open("/tmp/arm64-build.sh.tpl").read()
          for k, v in m.items():
              tpl = tpl.replace(k, v)
          open("/tmp/arm64-build.sh", "w").write(tpl)
          print("injected ok")
          PYGEN
          sudo cp -f /tmp/arm64-build.sh /tmp/archlinux/bin/arm64-build.sh
          sudo chmod +x /tmp/archlinux/bin/arm64-build.sh
          echo "✅ arm64-build.sh 就位: $(sudo wc -l < /tmp/archlinux/bin/arm64-build.sh) lines"
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/archlinux/tmp/ccache.tar.xz
          key: bcc-arch-arm64-ccache-${{ inputs.wine_branch || 'proton' }}
          restore-keys: |
            bcc-arch-arm64-ccache-

      - name: Compile in BCC Arch chroot
        run: |
          set -e
          cd /tmp
          bash "$GITHUB_WORKSPACE/mount.sh" archlinux mount
          set +e
          timeout 12600 sudo chroot archlinux /bin/arm64-build.sh
          RC=$?
          set -e
          bash "$GITHUB_WORKSPACE/mount.sh" archlinux unmount
          if [ $RC -ne 0 ]; then
            echo "❌ chroot 构建失败，RC=$RC"
            echo "--- arm64-build 日志尾部 ---"
            tail -100 /tmp/archlinux/tmp/wine-arm64-build.log 2>/dev/null || true
            exit $RC
          fi

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/archlinux/tmp/ccache.tar.xz
          key: bcc-arch-arm64-ccache-${{ inputs.wine_branch || 'proton' }}-${{ github.run_id }}

      - name: Collect artifacts
        run: |
          set -e
          ls -la "$OUT_DIR"
          NAME=$(cat "$OUT_DIR/BUILD_NAME.txt")
          echo "BUILD_NAME=$NAME" >> "$GITHUB_ENV"
          mkdir -p /tmp/artifacts
          cp "$OUT_DIR"/*.tar.xz "$OUT_DIR"/checksums.txt /tmp/artifacts/
          ls -la /tmp/artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUILD_NAME }}
          path: /tmp/artifacts/*
          retention-days: 30

      - name: Publish Release
        if: ${{ inputs.publish_release != 'false' }}
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.BUILD_NAME }}
          name: ${{ env.BUILD_NAME }}
          body: |
            Wine ARM64 WOW64 (arm64ec) — BCC Arch chroot build

            | 项目 | 值 |
            |---|---|
            | build | `${{ env.BUILD_NAME }}` |
            | wine_branch | `${{ inputs.wine_branch || 'proton' }}` |
            | archs | `${{ inputs.wine_archs || 'arm64ec,aarch64,i386' }}` |
            | 环境 | BCC Arch Linux chroot + aarch64-linux-gnu cross + llvm-mingw |
            | 39-bit VA | `${{ inputs.enable_39bit_va || 'true' }}` |
            | noexec | `${{ inputs.enable_noexec_fallback || 'true' }}` |
            | FEX | `${{ inputs.build_fex || 'true' }}` |
            | workflow | `${{ github.sha }}` |
            | run | #${{ github.run_number }} |
          files: |
            /tmp/artifacts/*.tar.xz
            /tmp/artifacts/checksums.txt
          draft: false
          prerelease: false
