name: Build Wine ARM64EC (BCC Ubuntu 24.04)

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      wine_branch:
        description: 'Wine branch/tag'
        required: false
        default: 'wine-11.18'
        type: string
      archs:
        description: 'PE archs for --enable-archs'
        required: false
        default: 'arm64ec,aarch64,i386'
        type: string
      apply_userpatches:
        description: 'Apply 0060 / 0061 / termux-dns-fix patches from repo root'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
  schedule:
    - cron: '30 18 1 * *'

env:
  ROOTFS_NAME: ubuntu2404
  ROOTFS_URL: https://github.com/as14725836/BCC/releases/download/wine-arm64ec-ubuntu2404-bcc-latest/wine-ubuntu2404-bcc-arm64ec.tar.xz
  LLVM_MINGW_DIR: llvm-mingw-20260908-ucrt-ubuntu-22.04-x86_64
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260908/llvm-mingw-20260908-ucrt-ubuntu-22.04-x86_64.tar.xz
  BCC_MOUNT_URL: https://raw.githubusercontent.com/as14725836/BCC/main/mount.sh
  OUT_NAME: wine-arm64ec

jobs:
  build-arm64ec:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet "/usr/local/lib/android" /opt/ghc 2>/dev/null || true
          df -h /

      - name: Download rootfs and PE toolchain
        run: |
          set -x
          aria2c -s$(nproc) -x$(nproc) -k1M -o rootfs.tar.xz "$ROOTFS_URL"
          sudo tar -xf rootfs.tar.xz -C /tmp
          aria2c -s$(nproc) -x$(nproc) -k1M -o llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          tar -xf llvm-mingw.tar.xz -C /tmp
          sudo mkdir -p /tmp/${ROOTFS_NAME}/opt
          sudo mv /tmp/${LLVM_MINGW_DIR} /tmp/${ROOTFS_NAME}/opt/llvm-mingw
          wget -q -O /tmp/bcc-mount.sh "$BCC_MOUNT_URL"
          sudo chmod +x /tmp/bcc-mount.sh
          echo "===== PE toolchain check ====="
          ls /tmp/${ROOTFS_NAME}/opt/llvm-mingw/bin | grep -cE '^arm64ec-w64-mingw32-'
          ls /tmp/${ROOTFS_NAME}/opt/llvm-mingw/bin | grep -E '^arm64ec-w64-mingw32-(clang|gcc)$'
          ls /tmp/${ROOTFS_NAME}/opt/llvm-mingw/bin | grep -E '^x86_64-w64-mingw32-(clang|gcc)$'
          /tmp/${ROOTFS_NAME}/opt/llvm-mingw/bin/arm64ec-w64-mingw32-clang --version | head -2 || true
          echo "--- arm64ec predefined macros (aarch64/x86_64/arm64ec) ---"
          arm64ec-w64-mingw32-clang -dM -E -x c /dev/null 2>/dev/null | grep -E '__aarch64__|__x86_64__|__arm64ec__|_M_ARM64EC|_M_AMD64|_M_ARM64' | sort
          echo "--- end macros ---"
          echo "--- aarch64 PE predefined macros ---"
          aarch64-w64-mingw32-clang -dM -E -x c /dev/null 2>/dev/null | grep -E '__aarch64__|__x86_64__|__arm64ec__|_M_ARM64' | sort || true
          echo "--- end aarch64 macros ---"

      - name: Stage user patches
        run: |
          mkdir -p /tmp/stage-patches
          for f in 0060-quartz-implement-colour-filter.patch \
                   0061-qasf-deliver-compressed-asf-streams.patch \
                   termux-dns-fix.patch; do
            if [ -f "$f" ]; then cp "$f" /tmp/stage-patches/; echo "staged: $f"; else echo "not found (skipped): $f"; fi
          done
          sudo rm -rf /tmp/${ROOTFS_NAME}/tmp/patches
          sudo cp -r /tmp/stage-patches /tmp/${ROOTFS_NAME}/tmp/patches
          ls -la /tmp/${ROOTFS_NAME}/tmp/patches

      - name: Write build script
        run: |
          cat > /tmp/build-arm64ec.sh << 'BUILDEOF'
          #!/bin/bash
          set -x
          export DEBIAN_FRONTEND=noninteractive
          export PATH=/opt/llvm-mingw/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          export LANG=C.UTF-8
          export LC_ALL=C.UTF-8

          # arm64 multiarch 的 pkg-config（交叉编译关键）
          export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig

          WINE_BRANCH="${WINE_BRANCH:-wine-11.18}"
          ARCHS="${ARCHS:-arm64ec}"
          APPLY_USERPATCHES="${APPLY_USERPATCHES:-true}"
          WORK=/tmp/build
          mkdir -p "$WORK"
          cd "$WORK" || exit 1

          echo "===== 0) toolchain ====="
          arm64ec-w64-mingw32-clang --version | head -2 || { echo "FATAL: arm64ec clang missing"; exit 1; }
          aarch64-linux-gnu-gcc --version | head -1
          # ensure host-prefixed cross g++ (wine configure needs it)
          if ! command -v aarch64-linux-gnu-g++ >/dev/null 2>&1; then
            echo "installing g++-aarch64-linux-gnu ..."
            apt-get update -qq > /tmp/apt-cross.log 2>&1
            apt-get install -y -qq g++-aarch64-linux-gnu >> /tmp/apt-cross.log 2>&1
            tail -5 /tmp/apt-cross.log
          fi
          aarch64-linux-gnu-g++ --version | head -1 || echo "WARN: cross g++ missing"
          # native wine build 需要 32 位开发库（wine configure 会检测 gcc -m32）
          apt-get update -qq > /tmp/apt-m32.log 2>&1
          apt-get install -y -qq gcc-multilib g++-multilib libc6-dev-i386 >> /tmp/apt-m32.log 2>&1 || echo "WARN: multilib install failed"
          tail -5 /tmp/apt-m32.log
          echo "int main(void){return 0;}" > /tmp/m32test.c
          gcc -m32 /tmp/m32test.c -o /tmp/m32test && echo "m32 OK" || echo "WARN: m32 still broken"
          rm -f /tmp/m32test /tmp/m32test.c

          echo "===== 1) wine source: $WINE_BRANCH ====="
          if [ ! -d wine/.git ]; then
            git clone --depth 1 -b "$WINE_BRANCH" https://github.com/wine-mirror/wine.git wine || exit 1
          fi
          cd wine || exit 1
          git log --oneline -1

          if [ "$APPLY_USERPATCHES" = "true" ] && [ -d /tmp/patches ]; then
            echo "===== 2) user patches ====="
            for p in /tmp/patches/*.patch; do
              [ -f "$p" ] || continue
              echo "--- applying $(basename "$p")"
              if patch -p1 --forward --no-backup-if-mismatch < "$p"; then
                echo "    OK"
              else
                echo "    FAILED or already applied"
              fi
            done
            echo "--- .rej files:"
            find . -name '*.rej'
          fi

          echo "===== 2.5) native wine-tools (for x86_64 build host) ====="
          TOOLS_DIR="$WORK/wine-tools"
          if [ ! -x "$TOOLS_DIR/tools/winebuild/winebuild" ]; then
            rm -rf "$TOOLS_DIR"
            mkdir -p "$TOOLS_DIR"
            cd "$TOOLS_DIR" || exit 1
            "$WORK/wine/configure" --enable-win64 --disable-tests --with-mingw=llvm-mingw > /tmp/tools-configure.log 2>&1
            rc=$?
            echo "tools configure rc=$rc"
            tail -25 /tmp/tools-configure.log
            if [ $rc -ne 0 ]; then exit 1; fi
            # autoheader can leave "#undef PACKAGE_VERSION"; winebuild/main.c needs it.
            if ! grep -q "^#define PACKAGE_VERSION" include/config.h 2>/dev/null; then
              _wv=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile 2>/dev/null | head -1)
              [ -n "$_wv" ] || _wv=11.18
              sed -i "s|^\(/\* \)\?#undef PACKAGE_VERSION\( \*/\)\?$|#define PACKAGE_VERSION \"$_wv\"|" include/config.h
              echo "patched PACKAGE_VERSION=$_wv into native tools config.h"
            fi
            # NOTE: tools/Makefile is a stub that only knows install/makedep/make_xftmpl,
            # so "make -C tools" never descends into winebuild/widl/wrc. Use top-level targets.
            make -j"$(nproc)" \
              tools/makedep \
              tools/winebuild/winebuild \
              tools/widl/widl \
              tools/wrc/wrc \
              tools/wmc/wmc \
              tools/winegcc/winegcc \
              > /tmp/tools-make.log 2>&1
            rc=$?
            echo "tools make rc=$rc"
            tail -40 /tmp/tools-make.log
            if [ $rc -ne 0 ]; then exit 1; fi
            # wrc is a build-host tool and locates nls relative to its own path:
            #   $TOOLS_DIR/tools/wrc/wrc  ->  $TOOLS_DIR/nls
            # The wine-tools tree has no nls/, so wrc fails with "unable to load locale.nls".
            make -j"$(nproc)" nls/ > /tmp/tools-nls.log 2>&1 || true
            if [ ! -f nls/locale.nls ]; then
              echo "make nls/ did not produce locale.nls; copying from source tree"
              mkdir -p nls
              cp -a "$WORK/wine/nls/." nls/
            fi
            ls -la nls/locale.nls
          fi
          _missing=""
          for _t in tools/makedep tools/winebuild/winebuild tools/widl/widl tools/wrc/wrc nls/locale.nls; do
            if [ -f "$TOOLS_DIR/$_t" ]; then :; elif [ -x "$TOOLS_DIR/$_t" ]; then :; else _missing="$_missing $_t"; fi
          done
          if [ -n "$_missing" ]; then
            echo "!!! missing wine tools:$_missing"
            echo "--- native configure: mingw / PE arch lines ---"
            grep -iE 'mingw|cross|PE |winebuild' /tmp/tools-configure.log | head -30
            echo "--- tools dir ---"
            ls -la "$TOOLS_DIR/tools" | head -40
            echo "--- make tail ---"
            tail -50 /tmp/tools-make.log
            exit 1
          fi
          ls -la "$TOOLS_DIR/tools/winebuild/winebuild" "$TOOLS_DIR/tools/makedep"

          echo "===== 3) configure ====="
          BUILD_DIR="$WORK/build-$ARCHS"
          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          cd "$BUILD_DIR" || exit 1
          CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ "$WORK/wine/configure" \
            --host=aarch64-linux-gnu \
            --enable-archs="$ARCHS" \
            --with-mingw=llvm-mingw \
            --with-wine-tools="$TOOLS_DIR" \
            --prefix=/opt/wine-arm64ec \
            --disable-win16 \
            --disable-tests \
            --without-capi \
            --without-coreaudio \
            --without-cups \
            --without-gphoto \
            --without-opencl \
            --without-oss \
            --without-pcap \
            --without-pcsclite \
            --without-sane \
            --without-udev \
            --without-usb \
            --without-v4l2 \
            --without-wayland \
            --without-xinerama \
            > /tmp/configure.log 2>&1
          rc=$?
          echo "configure rc=$rc"
            echo "--- cross compiler in use ---"
            grep -nE '^(CC|CXX|CROSSCC|HOST_ARCH) *=' Makefile | head -6
            which aarch64-linux-gnu-gcc aarch64-linux-gnu-g++ 2>&1 | head -4
          tail -50 /tmp/configure.log
          if [ $rc -ne 0 ]; then exit 1; fi
            if ! grep -q "^#define PACKAGE_VERSION" include/config.h 2>/dev/null; then
              _wv=$(sed -n 's/^PACKAGE_VERSION = //p' Makefile 2>/dev/null | head -1)
              [ -n "$_wv" ] || _wv=11.18
              sed -i "s|^\(/\* \)\?#undef PACKAGE_VERSION\( \*/\)\?$|#define PACKAGE_VERSION \"$_wv\"|" include/config.h
              echo "patched PACKAGE_VERSION=$_wv into cross config.h"
            fi
            # --- winnt.h: arm64ec / aarch64 compatibility ---
            # winnt.h picks the CPU CONTEXT via "#ifdef __x86_64__" (AMD64 types) /
            # "#ifdef __aarch64__" (ARM64 types). Reality per translation unit:
            #   x86_64 PE : __x86_64__                            -> AMD64 types
            #   arm64ec PE: __x86_64__ + __arm64ec__ (no __aarch64__) -> ARM64 types
            #   aarch64 PE: __aarch64__                           -> ARM64 types
            #   unix side : __aarch64__ (gcc)                     -> ARM64 types
            # So the AMD64 block must require that NEITHER arm macro is present.
            _W="$WORK/wine/include/winnt.h"
            echo "--- winnt.h conditions BEFORE ---"
            grep -nE "^(#if|#elif).*(__aarch64__|__x86_64__)" "$_W" | head -16
            # 1) ARM64 type block: also active for arm64ec
            sed -i 's@^#ifdef __aarch64__$@#if defined(__aarch64__) || defined(__arm64ec__)@' "$_W"
            sed -i 's@^#if defined(__aarch64__) \&\& !defined(__arm64ec__)$@#if defined(__aarch64__) || defined(__arm64ec__)@' "$_W"
            # 2) AMD64 type block: only for a genuine x86_64 PE target
            sed -i 's@^#ifdef __x86_64__$@#if defined(__x86_64__) \&\& !defined(__aarch64__) \&\& !defined(__arm64ec__)@g' "$_W"
            sed -i 's@^#if defined(__x86_64__) \&\& !defined(__arm64ec__)$@#if defined(__x86_64__) \&\& !defined(__aarch64__) \&\& !defined(__arm64ec__)@g' "$_W"
            sed -i 's@^#if defined(__x86_64__) \&\& !defined(__aarch64__)$@#if defined(__x86_64__) \&\& !defined(__aarch64__) \&\& !defined(__arm64ec__)@g' "$_W"
            echo "--- winnt.h conditions AFTER ---"
            grep -nE "^(#if|#elif).*(__aarch64__|__x86_64__)" "$_W" | head -16
            echo "--- winnt.h lines 2014 + 8076 ---"
            awk 'NR==2014 || NR==8076' "$_W"
            _s="#if defined(__x86_64__) && !defined(__aarch64__) && !defined(__arm64ec__)"
            _n1=$(grep -cF "$_s" "$_W" || true)
            _n2=$(grep -c "defined(__aarch64__) || defined(__arm64ec__)" "$_W" || true)
            echo "winnt.h fix: shielded $_n1 x86_64 block(s); ARM64 conditions: $_n2"
            # --- winnt.h needs __aarch64__ on the PE side too ---
            # wine configure reports "we need to define __aarch64__: yes" (WINE_CHECK_DEFINE)
            # but that -D only lands in the unix-side CFLAGS; the PE compilers do not get it,
            # so winnt.h's "#ifdef __aarch64__" ARM64 CONTEXT block never fires.
            for _a in aarch64 arm64ec; do
              if grep -q "^${_a}_EXTRACFLAGS = " Makefile; then
                sed -i "s|^${_a}_EXTRACFLAGS = |${_a}_EXTRACFLAGS = -D__aarch64__ |" Makefile
              else
                sed -i "s|^${_a}_CFLAGS = |${_a}_CFLAGS = -D__aarch64__ |" Makefile
              fi
            done
            grep -E "^(aarch64|arm64ec)_(EXTRACFLAGS|CFLAGS) *=" Makefile
          echo "--- PE arch detection ---"
          grep -iE 'arm64ec|x86_64-w64|mingw|PE ' /tmp/configure.log | head -25
          echo "--- toolchain summary ---"
          grep -E '^ (CC|CROSSCC|HOST_ARCH)|archs *:' /tmp/configure.log | head -20

          echo "===== 4) make ====="
          make -j"$(nproc)" > /tmp/make.log 2>&1
          rc=$?
          echo "make rc=$rc"
            echo "--- context around first error (includes compile command) ---"
            grep -n -B12 'error:' /tmp/make.log 2>/dev/null | head -70 || true
            echo "--- all error lines ---"
            grep -n 'error:' /tmp/make.log 2>/dev/null | head -25 || true
            echo "--- tail of make.log ---"
            tail -60 /tmp/make.log
          if [ $rc -ne 0 ]; then exit 1; fi

          echo "===== 5) install ====="
          rm -rf /tmp/wine-out
          make install DESTDIR=/tmp/wine-out > /tmp/install.log 2>&1
          rc=$?
          echo "install rc=$rc"
          if [ $rc -ne 0 ]; then tail -40 /tmp/install.log; exit 1; fi

          echo "===== 6) result ====="
          ls -la /tmp/wine-out/opt/wine-arm64ec/bin | head -20
          echo "--- PE dll dirs ---"
          ls -d /tmp/wine-out/opt/wine-arm64ec/lib/wine/*-windows 2>/dev/null
          echo "BUILD DONE"
          BUILDEOF
          sudo cp /tmp/build-arm64ec.sh /tmp/${ROOTFS_NAME}/bin/build-arm64ec.sh
          sudo chmod +x /tmp/${ROOTFS_NAME}/bin/build-arm64ec.sh
          bash -n /tmp/build-arm64ec.sh && echo "build script syntax OK"

      - name: Chroot build
        run: |
          cd /tmp
          sudo bash bcc-mount.sh mount ${ROOTFS_NAME}
          set +e
          sudo chroot ${ROOTFS_NAME} /usr/bin/env \
            WINE_BRANCH="${{ inputs.wine_branch || 'wine-11.18' }}" \
            ARCHS="${{ inputs.archs || 'arm64ec' }}" \
            APPLY_USERPATCHES="${{ inputs.apply_userpatches || 'true' }}" \
            /bin/bash /bin/build-arm64ec.sh 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          sudo bash bcc-mount.sh unmount ${ROOTFS_NAME}
          echo "=================================="
          echo "BUILD EXIT CODE: $rc"
          echo "=================================="
          exit $rc

      - name: Show logs on failure
        if: failure()
        run: |
          for f in /tmp/configure.log /tmp/make.log /tmp/build.log; do
            if [ -f "/tmp/${ROOTFS_NAME}$f" ]; then
              echo "########## $f ##########"
              tail -100 "/tmp/${ROOTFS_NAME}$f"
            fi
          done
          echo "########## fallback: build.log ##########"
          tail -150 /tmp/build.log || true

      - name: Package
        run: |
          set -x
          sudo rm -rf /tmp/out-stage
          mkdir -p /tmp/out-stage
          sudo mv /tmp/${ROOTFS_NAME}/tmp/wine-out /tmp/out-stage/wine-arm64ec
          sudo chown -R $(id -u):$(id -g) /tmp/out-stage
          du -sh /tmp/out-stage/wine-arm64ec
          tar -I 'xz -T$(nproc) -9' -cvf /tmp/${OUT_NAME}.tar.xz -C /tmp/out-stage wine-arm64ec
          ls -la /tmp/${OUT_NAME}.tar.xz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wine-arm64ec
          path: /tmp/wine-arm64ec.tar.xz
          retention-days: 14

      - name: Release
        if: github.event_name == 'workflow_dispatch' && inputs.wine_branch != '' || github.event_name == 'schedule'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: wine-arm64ec-${{ inputs.wine_branch || 'wine-11.18' }}-${{ github.run_number }}
          name: Wine ARM64EC ${{ inputs.wine_branch || 'wine-11.18' }} (Ubuntu 24.04 BCC)
          body: |
            Wine ARM64EC build.
            - Source: wine-mirror ${{ inputs.wine_branch || 'wine-11.18' }}
            - PE archs: ${{ inputs.archs || 'arm64ec' }}
            - Toolchain: BCC wine-arm64ec-ubuntu2404 rootfs + llvm-mingw 20260908
          files: /tmp/wine-arm64ec.tar.xz
          draft: false
          prerelease: true
